# 128 GB profile — model-limit sized; NOT MEASURED ON 128 GB HARDWARE.
#
# This is no longer a copy of the 64 GB policy. It runs the same models, so the
# per-token costs below are the 64 GB tier's REAL measurements; what 128 GB
# changes is how many of those tokens fit at once.
#
# THREE LEVELS OF EVIDENCE, kept apart deliberately:
#   MODEL-SUPPORTED   gemma4:26b-mlx and every qwen3.5 tier report 262144
#                     native context (`ollama show`). 229376 + 32768 = 262144 is
#                     the model's own ceiling, not a chosen number, and the
#                     runner enforces it with an HTTP 400 rather than a silent
#                     truncation ([REAL] 2026-08-21).
#   MEASURED (64 GB)  MLX allocates KV lazily at 45.4 KB per token in use, so a
#                     filled 262,144 window costs ~27.5 GiB (weights ~16.15 GiB
#                     + ~11.35 GiB KV). One fits 64 GB, so both tiers admit
#                     the native window; two filled sessions (primary and
#                     cyber) fit 128 GB with room, which is what this tier adds.
#   UNVERIFIED        no 128 GB machine has run this. Nothing here is claimed as
#                     hardware-validated.
#
# WHAT 128 GB DOES NOT BUY: prefill speed. It is the same model on the same class
# of GPU, so cold prefill per token is unchanged. More memory means more
# concurrent sessions and less eviction, not a faster clock.
#
# Geometry follows the one rule in docs/architecture.md#geometry: admission is
# bounded by memory up to the backend's native window, and compaction is the
# client's latency budget, never a geometry input. Every chat role totals the
# native 262144: Gemma roles as 229376 + 32768, the Qwen fast role as 253952 + 8192.
#
# Engine behaviour is owned by deploy/litellm/registry.yaml.
status = "model-limit-sized"  # ceilings from real model limits; not measured on 128 GB hardware

disk_gb = 42

# ── architecture — shared large-context coding/reasoning tier ─────────────────
# The one big-context capability every client shares (Claude Code, Codex, VS Code):
# design, deep reasoning, AND large interactive/agent prompts. This tier declares
# gemma4's FULL native 262144 window; there is no larger setting to grow into.
# GEOMETRY, 2026-08-21. This tier is the MAX-CAPABILITY profile: it starts from
# the 64 GB quality policy and removes the memory-driven compromises, it does not
# inherit them.
#
# num_ctx stays at gemma4's full native 262144. [REAL] Recall does NOT degrade at
# depth: a four-constant retrieval task with the constants planted at 5%, 35%,
# 62% and 88% of the prompt scored 4/4 at 57,031, 114,584 AND 235,993 prompt
# tokens on this runner. The only cost of depth is prefill (102 s / 236 s / 723 s
# cold, unique preamble, so a real cache miss) -- latency, not accuracy, and a
# 128 GB profile exists to expose capability rather than to optimise a rare cold
# miss. [REAL] The runner also enforces the ceiling LOUDLY: prompts above ~262144
# were rejected with HTTP 400 in ~400 ms, not silently truncated.
#
# max_output 16384 -> 32768, matching 64 GB. The reason 64 GB raised it is a
# property of GEMMA, not of that machine's memory: with reasoning enabled the
# model spends real output budget thinking before it answers. [REAL] measured
# here at 5,142 eval tokens for a SMALL coding task, and a 2,048-token cap
# truncated the answer to 0/3 correct where the same task at a 32,768 budget
# scored 3/3. 16384 left a 128 GB machine strictly LESS capable than a 64 GB one,
# which is backwards. context_input absorbs the change (229376 + 32768 = 262144)
# because the native ceiling is hard.
[architecture]
role = "Lead architect"
active = "gemma4:26b-mlx"
reasoning = true  # [REAL] gemma4:26b-mlx reports the `thinking` capability
                  # (`ollama show`) and returns reasoning_content. The models
                  # this line used to name (gpt-oss:20b, qwen3-coder) are gone.
context_input = 229376
max_output = 32768
temperature = 1.0
keep_alive = "6h"
purpose = ["architecture", "complex refactoring", "multi-step debugging", "design", "repository-wide planning", "large interactive/agent prompts"]
strengths = ["full native window shared across clients", "holds a whole subsystem in view", "strong code generation"]
weaknesses = ["slower", "cold prefill of a full window costs many minutes", "KV grows to ~27 GiB when filled"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
  # Google's published Gemma 4 setting, applied verbatim: temperature 1.0,
  # top_k 64, top_p 0.95. REPLACES the previous temp 0.1-0.2 / top_k 20,
  # which was chosen for run-to-run reproducibility. Two measurements drove
  # the change (2026-08-21, Ollama 0.32.14): sampling costs NOTHING in
  # throughput here -- draft acceptance was 0.79 at temp 0.1 and 0.77 at
  # temp 1.0, a gap inside the measured spread. This does not establish
  # equal throughput on every workload or improved coding quality. The
  # vendor preset is the baseline; quality requires scored task results.
  # Anything needing determinism should pass a per-request temperature
  # rather than pinning the whole role.
# ── implementation — everyday working coder ──────────────────────────────────
[implementation]
role = "Daily coding"
active = "gemma4:26b-mlx"
  # Same physical model as architecture, deliberately: this is a role boundary
  # (sampling, output ceiling), not a model boundary. Same input window
  # too: the MLX runner enforces context per-request, so three roles declaring
  # three different num_ctx still share ONE resident copy of the weights.
  # [REAL] Capabilities on 2026-08-21 (`ollama show gemma4:26b-mlx`):
  # completion, tools, thinking. NO insert, and NO vision -- the MLX
  # conversion drops vision that the GGUF gemma4:26b keeps. An earlier
  # version of this line read "insert YES, thinking NO" and was wrong on
  # both counts while `reasoning = true` sat directly beneath it.
reasoning = true
context_input = 229376
max_output = 32768
  # max_output raised 2026-08-21. [REAL] With no ceiling, gemma4 finished
  # real coding tasks in 2,337-5,175 tokens, so 8192 was not truncating
  # normal work -- but at the OLD sampling it looped, spending 13k-23k
  # CHARACTERS on reasoning and returning an EMPTY response 7 times in 25.
  # That failure is silent: the client sees a short answer, not an error.
  # A ceiling cannot fix looping, it only moves where the truncation lands,
  # This is output headroom; sampling guidance alone does not prove a cure.
  # Costs nothing: MLX allocates KV lazily, and num_ctx 196608 was verified
  # to load at 16.15 GiB resident, identical to a small window.
temperature = 1.0
keep_alive = "6h"
  # 6h, NOT -1. [REAL] keep_alive is LAST-WRITER-WINS on a shared model, and
  # architecture, implementation and review are all ONE resident
  # gemma4:26b-mlx. Measured 2026-08-21: a request carrying -1 set
  # expires_at to the year 2318, and a later 6h request reset it to +6h.
  # So the role used LAST governed the whole model -- and implementation is
  # the highest-frequency role, which meant 16 GiB stayed pinned forever
  # while architecture's 6h looked like the policy. Three roles sharing one
  # model must declare the SAME keep_alive or the shortest one is fiction.
purpose = ["implementation", "features", "refactoring", "tests", "shell", "python", "typescript"]
strengths = ["fast", "low memory", "excellent everyday code generation"]
weaknesses = ["architecture", "repository-wide planning"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
  # Google's published Gemma 4 setting, applied verbatim: temperature 1.0,
  # top_k 64, top_p 0.95. REPLACES the previous temp 0.1-0.2 / top_k 20,
  # which was chosen for run-to-run reproducibility. Two measurements drove
  # the change (2026-08-21, Ollama 0.32.14): sampling costs NOTHING in
  # throughput here -- draft acceptance was 0.79 at temp 0.1 and 0.77 at
  # temp 1.0, a gap inside the measured spread. This does not establish
  # equal throughput on every workload or improved coding quality. The
  # vendor preset is the baseline; quality requires scored task results.
  # Anything needing determinism should pass a per-request temperature
  # rather than pinning the whole role.
# ── review — code review / bug & security detection ──────────────────────────
[review]
role = "Code review"
active = "gemma4:26b-mlx"
reasoning = true  # thinking AND tools, both reported by `ollama show`.
context_input = 229376
max_output = 32768
temperature = 1.0
keep_alive = "6h"
  # 6h, NOT -1. [REAL] keep_alive is LAST-WRITER-WINS on a shared model, and
  # architecture, implementation and review are all ONE resident
  # gemma4:26b-mlx. Measured 2026-08-21: a request carrying -1 set
  # expires_at to the year 2318, and a later 6h request reset it to +6h.
  # So the role used LAST governed the whole model -- and implementation is
  # the highest-frequency role, which meant 16 GiB stayed pinned forever
  # while architecture's 6h looked like the policy. Three roles sharing one
  # model must declare the SAME keep_alive or the shortest one is fiction.
purpose = ["code review", "bug detection", "security review", "alternative solutions"]
strengths = ["careful analysis", "security awareness", "concrete findings"]
weaknesses = ["slower than the implementation tier", "not for bulk generation"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
  # Google's published Gemma 4 setting, applied verbatim: temperature 1.0,
  # top_k 64, top_p 0.95. REPLACES the previous temp 0.1-0.2 / top_k 20,
  # which was chosen for run-to-run reproducibility. Two measurements drove
  # the change (2026-08-21, Ollama 0.32.14): sampling costs NOTHING in
  # throughput here -- draft acceptance was 0.79 at temp 0.1 and 0.77 at
  # temp 1.0, a gap inside the measured spread. This does not establish
  # equal throughput on every workload or improved coding quality. The
  # vendor preset is the baseline; quality requires scored task results.
  # Anything needing determinism should pass a per-request temperature
  # rather than pinning the whole role.
  # Reasoning is on for architecture, implementation AND review -- this block
  # previously claimed "here and nowhere else", which contradicted the two
  # roles above it. Review is the tier where thinking most clearly
  # earns its latency. The proxy translates per-request reasoning_effort into
  # native thinking control; Gemma supports on/off rather than graded effort.
# ── fast — lightweight tool-enabled agent (NOT autocomplete) ────────────────
# Deliberately not the completion tier: this model exposes no FIM/insert
# capability, so inline autocomplete would fail QUIETLY.
[fast]
role = "Fast agent"
active = "qwen3.5:9b-mlx"
runtime_patch = "gemma4-switch-glu"
stop = ["<|im_end|>", "<|im_start|>"]
preferred = ["qwen3.5:9b-mlx", "qwen3.5:2b-mlx"]
# The official 9B MLX backend replaces the GGUF runner. Earlier GGUF tool-loop,
# memory and latency measurements do not validate this checkpoint's performance.
# Retain the existing admitted window; deep-window memory and native-client cache
# reuse require measurements on the selected MLX backend.
reasoning = false
context_input = 253952
max_output = 8192
temperature = 0.0
keep_alive = "20m"
  # No deploy/litellm/instructions/fast.md on purpose: this tier gets _core.md only, so
  # every extra system-prompt token is a larger share of its small budget.
purpose = ["task classification", "doc summarisation", "quick edits", "tool-driven lookups"]
strengths = ["tiny footprint", "native tool calling", "MLX runner; prefill depends on cache reuse"]
weaknesses = ["no FIM/insert - cannot do inline autocomplete", "weaker on large refactors"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 1.5
  # Retained fast-role sampling; no MLX quality improvement is implied.
  # Deliberate low-temperature role setting; not a guarantee of determinism.
# ── completion — inline autocomplete (FIM) ───────────────────────────────────
[completion]
role = "Autocomplete"
active = "qwen2.5-coder-1.5b-mlx"
  # First-party bf16 weights quantized at import: mlx-community conversions omit
  # quantization.mode and fail to load (ollama/ollama#19135). Qwen2 needs the
  # runtime bundle's loader. The 3B is under the non-commercial Qwen Research
  # License; the 1.5B is Apache-2.0.
source = { repository = "Qwen/Qwen2.5-Coder-1.5B", revision = "df3ce67c0e24480f20468b6ef2894622d69eb73b", quantize = "mxfp8", template = "{{- if .Suffix }}<|fim_prefix|>{{ .Prompt }}<|fim_suffix|>{{ .Suffix }}<|fim_middle|>{{- else }}{{ .Prompt }}{{- end }}" }
runtime_patch = "gemma4-switch-glu"
  # Native FIM tokens are ordinary vocabulary to the MLX runner, which would
  # otherwise emit <|fim_pad|> to max_output. Imported with the template too.
stop = ["<|endoftext|>", "<|fim_pad|>", "<|file_sep|>", "<|repo_name|>", "<|fim_prefix|>", "<|fim_suffix|>", "<|fim_middle|>", "<|im_end|>"]
preferred = ["qwen2.5-coder-1.5b-mlx"]
reasoning = false
context_input = 3968
  # max_output 512, raised from 128. A FIM suggestion is a few lines, not a
  # paragraph, but 128 truncated multi-line completions mid-block. 512 is
  # still far too small to be used as a chat role, which is the point.
max_output = 512
temperature = 0.1
keep_alive = "2h"
purpose = ["inline completion", "FIM", "quick syntax fixes"]
strengths = ["native FIM tokens", "fast", "~1.8 GB footprint"]
weaknesses = ["no reasoning", "short context", "not for chat"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0
  # Deliberate low-temperature role setting; not a guarantee of determinism.

# ── cyber — unrestricted coding on a separate model ─────────────────────────
# A separate model on purpose: abliterated weights are the capability, so it
# cannot share the primary's resident copy. Same Gemma 4 26B-A4B architecture,
# so it follows architecture's shape (reasoning, 32768 output) and Google's
# Gemma 4 sampling. [REAL] Imported and loaded on the patched Ollama / M3 Max
# 64 GB. [APPROX] At 8K context, two non-thinking coding fixtures and a tool
# round passed; short coding samples decoded at about 99-100 tokens/s.
# https://huggingface.co/google/gemma-4-26B-A4B-it
[cyber]
role = "Unrestricted coding"
active = "gemma4-26b-uncensored-mlx"
source = { repository = "00cyre/Gemma-4-26B-A4B-it-Uncensored-MLX-4bit", revision = "46ab84dbe20198a2ee5e66c3e69c039b8c60ad59" }
runtime_patch = "gemma4-switch-glu"
reasoning = true
context_input = 229376
max_output = 32768
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
  # 20m like `fast`, the other model beside the primary: 128 GB holds both, but
  # a second ~16 GiB of weights is still released when idle rather than held 6h.
keep_alive = "20m"
purpose = ["refusal-sensitive coding", "security research", "tool-driven edits"]
strengths = ["uncensored Gemma 4 26B-A4B weights", "native tool calling and thinking", "same window as architecture"]
weaknesses = ["a second ~16 GiB model beside the primary - a cold load on first use", "repository coding quality and full-window prefill unmeasured"]

# One guide per exact backend, shared by all capability aliases using it.
[model_guidance."gemma4:26b-mlx"]
name = "Gemma 4 26B-A4B"
prompting = ["Retrieve the relevant subsystem before requesting a change; a large window is not a reason to read an entire repository.","Use actual tool calls for inspection and edits, then verify the requested behavior with the client's tools."]
limitations = ["Cold prefill can take minutes near the admitted window; keep stable context and avoid unnecessary rereads.","Reasoning can exhaust output without a final answer; an empty or truncated reply is incomplete, not success."]
evidence = "[REAL] Local prefill and memory measurements inform this profile. [UNVERIFIED] These prompting suggestions have not been shown to improve repository task accuracy."
summary = "Gemma 4 26B MLX: shared coding and reasoning weights; capability aliases select different context budgets."
sources = ["https://huggingface.co/google/gemma-4-26B-A4B-it"]

[model_guidance."qwen3.5:9b-mlx"]
name = "Qwen3.5 9B"
prompting = ["Give one bounded change with relevant code, explicit input/output requirements and a few acceptance examples.","Use the client's real syntax/test tools, return the exact failing output for repair, and stop or escalate after repeated failure."]
limitations = ["Guidance is a starting point, not a measured guarantee of coding correctness."]
evidence = "[REAL] On the 64 GB host, Ollama 0.40.8-ailocal.18631.3 loaded the official MLX checkpoint, reported runner=mlx and completed a simple native tool/result round trip; its manifest matched the reviewed digest. [APPROX] One implementation-role edit fixture, non-thinking t0.7, 90-second client limits: Both Codex and Claude timed out with unchanged fixture code and failing independent assertions. [UNVERIFIED] Full-window behavior and physical target-tier memory fit. Earlier GGUF measurements do not transfer."
summary = "Qwen3.5 9B MLX: keep tasks bounded and verify edits with real tools."
sources = ["https://ollama.com/library/qwen3.5:9b-mlx","https://huggingface.co/Qwen/Qwen3.5-9B#best-practices"]

[model_guidance."qwen2.5-coder-1.5b-mlx"]
name = "Qwen2.5-Coder 1.5B (MLX mxfp8)"
summary = "Fill-in-the-middle autocomplete: a base model with native FIM tokens, not a chat or agent model."
prompting = ["Through ailocal-completion, send one prompt already formatted as <|fim_prefix|>PREFIX<|fim_suffix|>SUFFIX<|fim_middle|>; the proxy drops a separate suffix field. Ollama /api/generate accepts prompt and suffix directly.", "Keep requests short and local to the cursor; it has no instruction tuning."]
limitations = ["No chat template, tool calling or reasoning.", "A client-supplied stop list replaces the imported one; it must still include <|endoftext|> and <|fim_pad|>.", "Quality is a 1.5B model's: plausible local completions, not repository understanding."]
evidence = "[REAL] 2026-10-26, 64 GB host, Ollama 0.40.8-ailocal.18631.4 with the Qwen2 MLX loader patch: the mxfp8 import loaded as architecture qwen2, and an executable 10-case FIM battery passed 10/10 directly through /api/generate with suffix (0.38 s warm median) and 10/10 through ailocal-completion with a client-formatted FIM prompt (0.33 s). [REAL] LiteLLM v1.106.2 drops suffix on /v1/completions; a request with suffix ran to num_predict. [APPROX] 80-case single-line infill prototype on the same host: bf16 10/80 exact, mxfp8 10/80 (58/80 agree with bf16), nvfp4 7/80, GGUF Q4_K_M 6/80; GGUF was about 1.6x faster warm. [UNVERIFIED] Memory fit on 16 GB hardware."
sources = ["https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B", "https://github.com/QwenLM/Qwen2.5-Coder#3-file-level-code-completion-fill-in-the-middle", "https://github.com/ollama/ollama/issues/19135", "https://github.com/BerriAI/litellm/issues/6900"]

[model_guidance."gemma4-26b-uncensored-mlx"]
name = "Gemma 4 26B-A4B uncensored"
prompting = ["Give one bounded coding change with relevant source, explicit acceptance criteria and real test output.","Use the client's tools for inspection and verification; return exact errors for a bounded repair attempt.","Use non-thinking mode for simple requests when appropriate; reserve thinking for work that benefits from it."]
limitations = ["Upstream describes this conversion as refusal-validated and capability-unverified, and observed a garbled token; verify every API and claim against the real code.","Text-only conversion; do not send images or audio.","Keep earlier turns' thinking out of history except on tool-call turns, as Google's Gemma 4 card advises.","Native Codex edit pilots produced invalid patch formatting; verify actual file changes and tests rather than trusting client exit status.","Short direct-provider checks do not establish repository-scale reliability or full-window performance.","A benign non-refusal is not evidence of universal non-refusal or coding correctness."]
evidence = "[REAL] Checkpoint load and native tool calls work with the reviewed Ollama patches on the 64 GB host. [APPROX] Two small coding fixtures passed, with about 99–100 tokens/s in non-thinking mode. Native Codex edit pilots did not complete a verified change; larger workloads and 128 GB hardware remain unmeasured."
summary = "Unrestricted Gemma 4 26B-A4B MLX conversion with native thinking and tools; verify edits with real tests."
sources = ["https://huggingface.co/00cyre/Gemma-4-26B-A4B-it-Uncensored-MLX-4bit","https://huggingface.co/google/gemma-4-26B-A4B-it"]
