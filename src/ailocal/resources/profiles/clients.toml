# clients.toml — the semantic map generation can't infer.
#
# profiles/<tier>.toml says WHAT each capability is. This says WHICH capability each client
# surface uses. Together they are the single source of truth: generation reads both and
# regenerates every client config + the LiteLLM alias block, so a future capability change never
# requires hand-editing a client file.
#
# Values on the right are capability names from the active profile: `primary`, `fast`, `cyber`,
# `completion` (policy.ROLES). `fast` is the primary with thinking off, and only a tier whose
# primary thinks declares it (64gb, 128gb). Where a tier omits it, every entry below that names
# `fast` resolves to `primary` — one rule, policy.resolve_capability(), no per-tier mapping here.

# Claude Code
[claude]
  # The chat role with the largest output reserve and the tier's thinking mode.
launch_default = "primary"
  # built-in slot -> capability. Also emitted into model_group_alias so `model: opus`
  # in a subagent (or a background Opus/Sonnet/Haiku call) routes to the right tier.
  # haiku is deliberately NOT `completion`. Claude Code uses its haiku slot for real
  # background work (post-tool processing, summarisation), not autocomplete — those
  # requests routinely carry the full conversation. Pointing it at the 4096-token FIM
  # model made every such call a hard 400: measured ContextWindowExceededError,
  # Max Input Tokens=4096, Got=12023. `completion` is FIM only; never a chat tier.
  # haiku -> fast: thinking off for background traffic where the tier offers it,
  # and the non-thinking primary where it does not. Three slots on `primary` is by
  # design: /model is the generated modelPicker, one row per capability.
slots = {opus = "primary", sonnet = "primary", haiku = "fast", fable = "primary"}
  # The strongest mode the agent MCP's `delegate` may grant a delegated claude-local
  # worker, weakest first. "text": no tools, in an empty directory. "research": reads
  # inside its working directory and web search through ailocal's research server, no
  # writes or commands. "edit" (the default): edits confined to the working directory,
  # Bash in the OS sandbox, ailocal's key files unreadable. "full": no sandbox and no
  # permission prompts, with the parent's full environment (SSH agent, tokens) -- for
  # tasks such as docker, git push or package installs. A call must ask for "full"
  # explicitly; this setting only permits it. Read on every call.
delegate_max_mode = "edit"
  # Largest CLAUDE.md this client root should carry. Published in the integration
  # contract for a co-installed instruction composer (Cadence) to fit, and checked by
  # `ailocal check` whoever wrote the file. Measured: a 17 KB policy file made the
  # local models re-read it or treat its directory as the working directory (#39).
instruction_max_bytes = 4096

# Codex CLI
[codex]
default = "primary"
  # As claude.delegate_max_mode, for a delegated codex-local worker. Codex offers no
  # "research" mode (its read-only sandbox still runs code), so "research" here
  # permits text only. "edit" is a workspace permission profile with ailocal's key
  # files denied; "full" is danger-full-access.
delegate_max_mode = "edit"
  # As claude.instruction_max_bytes, for AGENTS.md in this root.
instruction_max_bytes = 4096

# External client compatibility names -> capability. These are NOT ailocal roles — they are model
# IDs that Claude Code and the OpenAI SDK hard-code and cannot be told to stop sending (e.g.
# claude-local background calls send claude-haiku-4-5). Without them those clients 404. The
# retired ailocal role names (architecture/implementation/review, and before them
# coder-main/coder-fast/deep-think*/supervisor/embed) are not listed here: generation serves
# the 0.15 names as deprecated aliases from policy.RETIRED_ROLES for one release.
[compat]
"claude-opus-4-8" = "primary"
"claude-opus-4-8-20251101" = "primary"
"claude-fable-5" = "primary"
"claude-sonnet-4-6" = "primary"
"claude-sonnet-4-6-20250219" = "primary"
"gpt-5.5" = "primary"
  # See the note on claude.slots above: these are conversational model IDs, so they
  # must not resolve to the 4096-token FIM tier.
"claude-haiku-4-5" = "fast"
"claude-haiku-4-5-20251001" = "fast"
"gpt-4o" = "primary"
"gpt-4o-mini" = "primary"
"gpt-3.5-turbo" = "primary"
