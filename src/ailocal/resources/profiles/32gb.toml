[fast]
role = "Fast agent (shared primary)"
active = "nemotron-3.5-bolt:e4b"
preferred = ["nemotron-3.5-bolt:e4b"]
reasoning = false
context_input = 57344
max_output = 8192
temperature = 1.0
keep_alive = "6h"
purpose = ["task classification", "summarisation", "quick edits", "tool-driven lookups"]
strengths = ["no extra model resident - shares the primary"]
weaknesses = ["larger than a dedicated 2b would be", "so marginally slower per token"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 0.0

[completion]
role = "Autocomplete (FIM)"
  # SEPARATE MODEL ON PURPOSE. The primary is an instruct model without FIM/insert
  # tokens, so it cannot do inline completion at all, and IDE completion needs
  # latency the primary cannot meet. qwen2.5-coder carries native FIM tokens.
active = "qwen2.5-coder:1.5b-base"
  # The official BASE tag, not the instruct one. Proxy clients reach Ollama
  # through LiteLLM, which drops `suffix` (BerriAI/litellm#6900) and sends the
  # client's FIM-formatted prompt as a chat message. The base template passes
  # it through; the instruct template wraps it in a user turn and infill fails.
  # GGUF, not MLX: Ollama's MLX runner has no Qwen2 loader, and the GGUF decodes
  # faster with the same fidelity (docs/maintenance.md#inline-completion).
stop = ["<|endoftext|>", "<|fim_pad|>", "<|file_sep|>", "<|repo_name|>", "<|fim_prefix|>", "<|fim_suffix|>", "<|fim_middle|>"]
preferred = ["qwen2.5-coder:1.5b-base"]
reasoning = false
context_input = 3968
  # max_output 512, raised from 128. A FIM suggestion is a few lines, not a
  # paragraph, but 128 truncated multi-line completions mid-block. 512 is
  # still far too small to be used as a chat role, which is the point.
max_output = 512
temperature = 0.1
  # Rotating, not pinned: self-unloads after 2h idle rather than staying resident
  # beside the primary indefinitely. ~1 GB footprint keeps this cheap to reload.
keep_alive = "2h"
purpose = ["inline completion", "FIM", "quick syntax fixes"]
strengths = ["native FIM tokens", "very fast", "~1 GB footprint"]
weaknesses = ["no reasoning", "short context", "not for chat"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0


# ── cyber — unrestricted coding on a separate model ─────────────────────────
# A separate model on purpose: abliterated weights are the capability, so it
# cannot share the primary's resident copy the way the four roles above do.
# Same E4B architecture and 65536 native window, so it follows implementation's
# shape (non-thinking, 8192 output) and NVIDIA's sampling. The recipe binds three
# reviewed blobs by digest: the Heretic Q4_K_M weights, the f16 projector from the
# same publisher revision, and NVIDIA's DFlash draft, byte-identical to the draft
# layer of Ollama's own nemotron-3.5-bolt:e4b-q4_K_M. `files` rather than `from`,
# because the publisher's pull attaches a different (Q8) projector.
[cyber]
role = "Unrestricted coding (separate model)"
active = "nemotron-3.5-bolt:e4b-unrestricted"
source = {model = "hf.co/mradermacher/Nemotron-3.5-Bolt-E4B-Heretic-GGUF:Q4_K_M", sha256 = "85c31197ff1d89b92a0e1c27cc033466b7f02dc916adba011414b7a7b80e44b6", renderer = "gemma4-nemotron", parser = "gemma4", draft_model = "hf.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB-DFlash:BF16", draft_sha256 = "8103aa42fd31fb661c3fbe8701d04d698ea2c5d09351dc3e8c9da639958de989", projector_model = "hf.co/mradermacher/Nemotron-3.5-Bolt-E4B-Heretic-GGUF:Nemotron-3.5-Bolt-E4B-Heretic.mmproj-f16.gguf", projector_sha256 = "8886bb621f720cd02c72dd185f9db77971d3a6d8dc7e546c7153f3bfdf00f860"}
preferred = ["nemotron-3.5-bolt:e4b-unrestricted"]
reasoning = false
context_input = 57344
max_output = 8192
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
  # 5m, not the primary's 6h: a second resident model and its KV are memory the
  # primary and clients cannot use, so it is released soon after it goes idle.
keep_alive = "5m"
purpose = ["refusal-sensitive coding", "security research", "tool-driven edits"]
strengths = ["unrestricted weights", "NVIDIA DFlash draft attached", "native tool calling", "same window as implementation"]
weaknesses = ["a second model beside the primary - a cold load on first use", "GGUF decode is ~3x slower than the MLX primary", "third-party abliterated weights"]

# One guide per exact backend, shared by all capability aliases using it.
[model_guidance."nemotron-3.5-bolt:e4b"]
input_modalities = ["text", "image"]
name = "Nemotron 3.5 Bolt E4B (MLX NVFP4, DFlash)"
summary = "NVIDIA Nemotron 3.5 Bolt E4B as Ollama serves it on Apple Silicon: MLX NVFP4 with its built-in DFlash draft, thinking off; verify edits with real tests."
prompting = ["One bounded task per request: exact inputs, outputs, acceptance checks, only the files it needs.", "Call the tool first, preface at most one line; retry a transient tool error once, then report it.", "Run the unchanged tests to verify an edit; truncated output is not a pass."]
limitations = ["64K window; tool_choice and stop strings are ignored, so ask for the call or format in words.", "Evidence is short suites, not repository-scale work; 32 GB fit unmeasured."]
evidence = "[REAL] 2026-11-05, 128 GB M-series host, stock Ollama 0.40.14, thinking off, vendor sampling, direct Ollama: a 5-task suite x5 passed 20/25 at ~221 tokens/s (DFlash acceptance 0.57) against Qwen3.5 4B 16/25 and Qwen3.5 9B 20/25; a tool loop with an injected EAGAIN passed 3/3 and recovered 1/1 at 261 tokens/s decode; EvalPlus HumanEval+ passed 81/93 (87.1%; published base 91.4%) of the first 93 of 164 problems at 159 tokens/s with no length cut-offs. Thinking on scored -1/25 and cost time. Benign over-refusal probe 0/8 refusal-like (keyword heuristic, not manual labels). Ollama manifest digest fe4af3f5907b9275322dfea4fc3e4208c64469d0a47e3c05030c10cd27b49b38, context_length 65536. [APPROX] The same-model GGUF comparison is bounded: the Heretic Q4_K_M GGUF of the same architecture with the same DFlash draft passed 19/25 at ~65 tokens/s; the official Q4_K_M of the unmodified weights was not run. [UNVERIFIED] Physical 32 GB fit, full-window latency, repository-scale accuracy; the library tag is mutable and not hash-pinned."
sources = ["https://ollama.com/library/nemotron-3.5-bolt:e4b", "https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16", "https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16/raw/main/generation_config.json", "https://github.com/ollama/ollama/issues/19552", "https://github.com/ollama/ollama/issues/15539"]

[model_guidance."qwen2.5-coder:1.5b-base"]
name = "Qwen2.5-Coder 1.5B base"
summary = "Fill-in-the-middle autocomplete only; send a FIM-formatted prompt, never a chat request."
prompting = ["Format the request as <|fim_prefix|>prefix<|fim_suffix|>suffix<|fim_middle|>; the proxy drops a separate suffix field.","Send as much surrounding prefix and suffix as the 3,968-token input allows; context, not instructions, is what improves a completion.","Stop at the end of the line or block the editor needs; temperature 0.1 keeps suggestions stable."]
limitations = ["A base model: it follows no instructions and has no system prompt, so pre-prompting does not improve it.","Apache-2.0.","Exact-match fidelity on single-line infill is low at this size; treat suggestions as drafts."]
evidence = "[REAL] 2026-10-26, MacBook Air M4 16 GB under memory pressure (11 GB swap in use), Ollama 0.40.8-ailocal.18631.3: on 80 held-out single-line infills from this repository plus 10 executable FIM cases, sent as a FIM-formatted chat message the way the proxy forwards it, qwen2.5-coder:1.5b-base scored 10/80 exact, 0.549 similarity, 10/10 executable, 1.8 s p50, 68 tok/s. The instruct tag qwen2.5-coder:1.5b scored 0/80 and 0/10 on the same path because its chat template wraps the prompt. [APPROX] Native suffix requests: base 9/80, instruct 7/80, MLX mxfp8 import 10/80; differences are within noise."
sources = ["https://ollama.com/library/qwen2.5-coder:1.5b-base","https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B","https://github.com/BerriAI/litellm/issues/6900"]

[model_guidance."nemotron-3.5-bolt:e4b-unrestricted"]
input_modalities = ["text", "image"]
name = "Nemotron 3.5 Bolt E4B unrestricted (Heretic GGUF, DFlash)"
summary = "Third-party abliterated Nemotron 3.5 Bolt E4B, Q4_K_M GGUF with NVIDIA's DFlash draft and the f16 projector, thinking off; unrestricted output is not evidence of accuracy."
prompting = ["One bounded task per request: exact inputs, outputs, acceptance checks, only the files it needs.", "Call the tool first, preface at most one line; retry a transient tool error once, then report it.", "Run the unchanged tests to verify an edit; truncated output is not a pass.", "Unrestricted output is not evidence of accuracy; verify edits and claims with real tools."]
