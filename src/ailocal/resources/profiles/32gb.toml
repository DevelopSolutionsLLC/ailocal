# profile: 32gb
# Declarative capability registry for 32 GB unified memory (Apple Silicon).
#
# SHARED PRIMARY BACKEND. architecture, implementation, review and fast all resolve
# to ONE model (qwen3.5:9b). That is deliberate, not an oversight: on 32 GB there is
# room for one resident agent model, and rotating several role-specific models would
# spend the tier's whole memory budget on load/evict churn. The capability aliases
# still differ — persona, sampling, reasoning and num_predict are per-capability —
# they simply share a backend. One model resident, no swapping.
#
# ONE SHARED num_ctx, NOT FOUR. qwen3.5 runs on the llama_cpp runner, where
# num_ctx is a FIXED RUNNER WINDOW set at first load, and an over-long prompt is
# TRUNCATED FROM THE FRONT with HTTP 200 and no error to the caller
# (registry.yaml, runtime_engines.llama_cpp). Four roles sharing one backend must
# therefore declare an IDENTICAL total_context, or whichever role loads the
# runner first silently decides the window for the other three. That is why the
# each role's context_input is therefore 139264 minus ITS OWN max_output: 122880
# for the 16384 roles, 131072 for the 8192 ones. The split is a role boundary;
# the total is a runner constraint. Raising one role alone is a silent defect.
#
# KV IS ALLOCATED EAGERLY HERE, unlike the MLX tiers, so num_ctx is a real memory
# commitment. [REAL] measured by loading qwen3.5:9b at each window with a
# one-token prompt (nothing else resident):
#     num_ctx  65536 -> 6.59 GiB      num_ctx 139264 -> 8.06 GiB
# ~21 KB per ctx-token; the +1.47 GiB between them IS this tier's context
# increase, for a window that more than doubled. That figure already includes
# whatever OLLAMA_NUM_PARALLEL does; do not multiply by the parallel count again.
# With the FIM model the tier sits near 9.5 GiB of 32 GB. Note this
# charges max_output too, so the ceiling is spent where it earns its keep:
# architecture and review get 16384 (long plans, long review reports),
# implementation and fast get 8192. With the tier total fixed, a larger ceiling
# comes out of that role's OWN input, not out of tier memory.
#
# num_predict is a generation CEILING, not an expected output length and not an
# extra fixed allocation.
#
# Field meanings are documented in profiles/64gb.toml, the reference schema.
# 32 GB targets useful daily coding and agent work on one shared 9b backend.
status = "configuration-verified"  # schema, selection and size are tested; not measured on 32 GB hardware
disk_gb = 9

[architecture]
role = "Lead architect (shared primary)"
active = "qwen3.5:9b"
preferred = ["qwen3.5:9b"]
reasoning = true
context_input = 122880
max_output = 16384
temperature = 0.1
keep_alive = "6h"
persona = true
purpose = ["architecture", "refactoring", "multi-step debugging", "design"]
strengths = ["shared resident primary - no load/evict churn", "native tool calling", "120K input, 16K output"]
weaknesses = ["smaller than the 64 GB tier's specialised models", "one backend serves four roles"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[implementation]
role = "Daily coding (shared primary)"
active = "qwen3.5:9b"
preferred = ["qwen3.5:9b"]
reasoning = false
context_input = 131072
max_output = 8192
temperature = 0.1
keep_alive = "6h"
persona = true
purpose = ["everyday coding", "features", "tests"]
strengths = ["same resident backend as architecture - no reload between roles"]
weaknesses = ["shares its budget with every other chat capability"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[review]
role = "Code review (shared primary)"
active = "qwen3.5:9b"
preferred = ["qwen3.5:9b"]
reasoning = true
context_input = 122880
max_output = 16384
temperature = 0.2
keep_alive = "6h"
persona = true
purpose = ["code review", "bug detection", "security review"]
strengths = ["reasoning enabled for review depth", "no separate model to load"]
weaknesses = ["not a dedicated review model as on the 64 GB tier"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[fast]
role = "Fast agent (shared primary)"
active = "qwen3.5:9b"
  # reasoning OFF for the same reason the 64 GB tier disables it on `fast`: a
  # classification tier that thinks past its budget returns empty content.
reasoning = false
preferred = ["qwen3.5:9b"]
context_input = 131072
max_output = 8192
temperature = 0.0
keep_alive = "6h"
persona = true
purpose = ["task classification", "summarisation", "quick edits", "tool-driven lookups"]
strengths = ["no extra model resident - shares the primary"]
weaknesses = ["larger than a dedicated 2b would be", "so marginally slower per token"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[completion]
role = "Autocomplete (FIM)"
  # SEPARATE MODEL ON PURPOSE. The primary is an instruct model without FIM/insert
  # tokens, so it cannot do inline completion at all, and IDE completion needs
  # latency the primary cannot meet. qwen2.5-coder carries native FIM tokens.
active = "qwen2.5-coder:1.5b"
preferred = ["qwen2.5-coder:1.5b"]
reasoning = false
context_input = 3968
  # max_output 512, raised from 128. A FIM suggestion is a few lines, not a
  # paragraph, but 128 truncated multi-line completions mid-block. 512 is
  # still far too small to be used as a chat role, which is the point.
max_output = 512
temperature = 0.1
  # Rotating, not pinned: self-unloads after 2h idle rather than staying resident
  # beside the primary indefinitely. ~1 GB footprint keeps this cheap to reload.
keep_alive = "2h"
persona = false
purpose = ["inline completion", "FIM", "quick syntax fixes"]
strengths = ["native FIM tokens", "very fast", "~1 GB footprint"]
weaknesses = ["no reasoning", "short context", "not for chat"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0


[compaction]
window = 108544  # effective window handed to the client's compactor
pct = 85  # compact at this % of the window
  # trigger: 92262 tokens
