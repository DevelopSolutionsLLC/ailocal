# profile: 32gb
# Declarative capability registry for 32 GB unified memory (Apple Silicon).
# Architecture, implementation, review and fast share Ollama's library tag
# nemotron-3.5-bolt:e4b, which Ollama serves on Apple Silicon as MLX NVFP4
# safetensors with NVIDIA's built-in DFlash draft. Cyber is a hash-pinned native
# GGUF import of the Heretic (abliterated) E4B with the same DFlash draft and
# its f16 projector. Completion is unchanged. Thinking is off in every chat role:
# measured 2026-11-05, it cost time and no accuracy. Identities and evidence:
# docs/model-audit.md, "16/32 GB: Nemotron 3.5 Bolt E4B replaces Qwen3.5".
#
# Geometry follows the one rule in docs/architecture.md#geometry: admission is
# bounded by memory up to the backend's native window, and compaction is the
# client's latency budget, never a geometry input.
#
# The backend's native window is 65536 tokens (gemma4.context_length), so every
# chat role totals 65536 and roles differ only in output reserve; the earlier
# 139264-token total cannot be admitted by this model. The same model set as
# 16 GB: the extra memory buys residency headroom (the primary ~7.2 GB and Cyber
# ~7.1 GB on disk, before KV), not a larger window. Physical 32 GB fit and
# simultaneous residency are unmeasured. No role needs the patched Ollama runtime.
status = "configuration-verified"  # schema, selection and size are tested; 32 GB fit and full-window latency are not measured
disk_gb = 16

# Sampling is NVIDIA's generation_config.json: temperature 1.0, top_p 0.95,
# top_k 64; min_p, presence and repeat penalties neutral. The measured suite ran
# at these values, so no role keeps the former fast-agent temperature exception.
# https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16/raw/main/generation_config.json
[architecture]
role = "Lead architect (shared primary)"
active = "nemotron-3.5-bolt:e4b"
preferred = ["nemotron-3.5-bolt:e4b"]
reasoning = false
context_input = 49152
max_output = 16384
temperature = 1.0
keep_alive = "6h"
purpose = ["architecture", "refactoring", "multi-step debugging", "design"]
strengths = ["shared resident primary - no load/evict churn", "built-in DFlash draft", "native tool calling"]
weaknesses = ["64K native window", "no thinking", "one backend serves four roles"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 0.0

[implementation]
role = "Daily coding (shared primary)"
active = "nemotron-3.5-bolt:e4b"
preferred = ["nemotron-3.5-bolt:e4b"]
reasoning = false
context_input = 57344
max_output = 8192
temperature = 1.0
keep_alive = "6h"
purpose = ["everyday coding", "features", "tests"]
strengths = ["same resident backend as architecture - no reload between roles"]
weaknesses = ["shares its budget with every other chat capability"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 0.0

[review]
role = "Code review (shared primary)"
active = "nemotron-3.5-bolt:e4b"
preferred = ["nemotron-3.5-bolt:e4b"]
reasoning = false
context_input = 49152
max_output = 16384
temperature = 1.0
keep_alive = "6h"
purpose = ["code review", "bug detection", "security review"]
strengths = ["larger output reserve for findings", "no separate model to load"]
weaknesses = ["not a dedicated review model as on the 64 GB tier"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
min_p = 0.0
