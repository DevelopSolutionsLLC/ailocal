evidence = "[REAL] 2026-11-05, 128 GB M-series host, stock Ollama 0.40.14, thinking off, vendor sampling, direct Ollama: the 5-task suite x5 passed 19/25 at ~65 tokens/s; a tool loop with an injected EAGAIN passed 3/3 and recovered 1/1 at 75 tokens/s decode. Created by hand through /api/create with files {model, mmproj} and draft_files {draft}: capabilities completion/vision/audio/tools/thinking, and Ollama's log showed draft-dflash speculation active at ~30% token acceptance, mean accepted length 2.2. Benign over-refusal probe 0/8 refusal-like (keyword heuristic). Weights SHA-256 85c31197ff1d89b92a0e1c27cc033466b7f02dc916adba011414b7a7b80e44b6 (mradermacher static quant of grumd0/Nemotron-3.5-Bolt-E4B-Heretic), projector 8886bb621f720cd02c72dd185f9db77971d3a6d8dc7e546c7153f3bfdf00f860 at revision 17e1d92dd208791ecd7101b5da5b99d8aa4a7ff5, draft 8103aa42fd31fb661c3fbe8701d04d698ea2c5d09351dc3e8c9da639958de989 at revision 0949a2eb7152ec6fda1a91ff9302aecbcd464fbf, byte-identical to the draft layer of Ollama's nemotron-3.5-bolt:e4b-q4_K_M. [APPROX] The publisher reports KL 0.0859 against the base on harmless prompts; not reproduced here. [UNVERIFIED] Universal non-refusal, repository-scale accuracy, vision through the proxy, physical 32 GB fit."
