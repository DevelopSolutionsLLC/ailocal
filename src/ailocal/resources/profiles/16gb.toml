# profile: 16gb
# Declarative capability registry for 16 GB unified memory (Apple Silicon).
#
# SHARED PRIMARY BACKEND. architecture, implementation, review and fast all resolve
# to ONE model (qwen3.5:4b). That is deliberate, not an oversight: on 16 GB there is
# room for one resident agent model, and rotating several role-specific models would
# spend the tier's whole memory budget on load/evict churn. The capability aliases
# still differ — sampling, reasoning and num_predict are per-capability —
# they simply share a backend. One model resident, no swapping.
#
# ONE SHARED num_ctx, NOT FOUR. qwen3.5 runs on the llama_cpp runner, where
# num_ctx is a FIXED RUNNER WINDOW set at first load and an over-long prompt is
# TRUNCATED FROM THE FRONT with HTTP 200 and no error to the caller
# (registry.yaml, runtime_engines.llama_cpp). Four roles sharing one backend must
# declare an IDENTICAL total_context, or whichever loads the runner first
# silently decides the window for the other three. Each role's context_input is
# therefore 106496 minus ITS OWN max_output: 90112 for the 16384 roles, 98304 for
# the 8192 ones. The split is a role boundary; the total is a runner constraint.
#
# KV IS ALLOCATED EAGERLY HERE, for the whole declared window, so num_ctx is a
# real memory commitment rather than a ceiling. [REAL] measured by loading
# qwen3.5:4b at each window with a one-token prompt (nothing else resident):
#     num_ctx  65536 -> 4.30 GiB      num_ctx 106496 -> 5.12 GiB
# i.e. ~21 KB per ctx-token, and the +0.82 GiB between those two IS the cost of
# this tier's context increase. That figure already includes whatever
# OLLAMA_NUM_PARALLEL does; do not multiply it by the parallel count again.
#
# WHAT ACTUALLY CAPS THIS TIER IS LATENCY, NOT MEMORY. num_ctx 131072 would cost
# only ~5.6 GiB and even the model's native 262144 only ~8.2 GiB, so memory would
# permit far more. A 16 GB Mac has the slowest GPU ailocal supports, and a full
# cold prefill at those depths costs minutes; 106496 is the largest window worth
# offering on hardware nobody has measured. qwen3.5:4b supports 262144 natively.
# With the FIM model the tier sits near 6.5 GiB of 16 GB.
#
# An output ceiling is charged eagerly here, so it is spent where it earns its
# keep: architecture and review get 16384 (long plans, long review reports),
# implementation and fast get 8192. Because the tier total is fixed, a larger
# ceiling is paid for out of that role's OWN input, not out of tier memory.
#
# num_predict is a generation CEILING, not an expected output length and not an
# extra fixed allocation.
#
# Field meanings are documented in profiles/64gb.toml, the reference schema.
# 16 GB is the minimum supported tier. Quality is below the larger tiers by design.
status = "configuration-verified"  # schema, selection and size are tested; not measured on 16 GB hardware
disk_gb = 9

# Sampling audited 2026-10-22 against Qwen guidance:
# https://huggingface.co/Qwen/Qwen3.5-4B#best-practices
# Vendor-aligned defaults are not a measured quality improvement on this tier.
[architecture]
role = "Lead architect (shared primary)"
active = "qwen3.5:4b"
preferred = ["qwen3.5:4b"]
reasoning = true
context_input = 90112
max_output = 16384
temperature = 0.6
keep_alive = "6h"
purpose = ["architecture", "refactoring", "multi-step debugging", "design"]
strengths = ["shared resident primary - no load/evict churn", "native tool calling", "88K input, 16K output"]
weaknesses = ["smaller than the 64 GB tier's specialised models", "one backend serves four roles"]
top_p = 0.95
top_k = 20
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 0.0
  # Qwen precise-coding thinking preset; see the source card linked above.

[implementation]
role = "Daily coding (shared primary)"
active = "qwen3.5:4b"
preferred = ["qwen3.5:4b"]
reasoning = false
context_input = 98304
max_output = 8192
temperature = 0.7
keep_alive = "6h"
purpose = ["everyday coding", "features", "tests"]
strengths = ["same resident backend as architecture - no reload between roles"]
weaknesses = ["shares its budget with every other chat capability"]
top_p = 0.8
top_k = 20
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 1.5
  # Qwen non-thinking general preset; keep reasoning off for this role.

[review]
role = "Code review (shared primary)"
active = "qwen3.5:4b"
preferred = ["qwen3.5:4b"]
reasoning = true
context_input = 90112
max_output = 16384
temperature = 0.6
keep_alive = "6h"
purpose = ["code review", "bug detection", "security review"]
strengths = ["reasoning enabled for review depth", "no separate model to load"]
weaknesses = ["not a dedicated review model as on the 64 GB tier"]
top_p = 0.95
top_k = 20
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 0.0
  # Qwen precise-coding thinking preset; see the source card linked above.

[fast]
role = "Fast agent (shared primary)"
active = "qwen3.5:4b"
  # reasoning OFF for the same reason the 64 GB tier disables it on `fast`: a
  # classification tier that thinks past its budget returns empty content.
reasoning = false
preferred = ["qwen3.5:4b"]
context_input = 98304
max_output = 8192
temperature = 0.0
keep_alive = "6h"
purpose = ["task classification", "summarisation", "quick edits", "tool-driven lookups"]
strengths = ["no extra model resident - shares the primary"]
weaknesses = ["larger than a dedicated 2b would be", "so marginally slower per token"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0
min_p = 0.0
presence_penalty = 1.5
  # Fast-agent role exception (4B quality not remeasured): retain t0/p0.9 and the installed model presence penalty.

[completion]
role = "Autocomplete (FIM)"
  # SEPARATE MODEL ON PURPOSE. The primary is an instruct model without FIM/insert
  # tokens, so it cannot do inline completion at all, and IDE completion needs
  # latency the primary cannot meet. qwen2.5-coder carries native FIM tokens.
active = "qwen2.5-coder:1.5b"
preferred = ["qwen2.5-coder:1.5b"]
reasoning = false
context_input = 3968
  # max_output 512, raised from 128. A FIM suggestion is a few lines, not a
  # paragraph, but 128 truncated multi-line completions mid-block. 512 is
  # still far too small to be used as a chat role, which is the point.
max_output = 512
temperature = 0.1
  # Rotating, not pinned: self-unloads after 2h idle rather than staying resident
  # beside the primary indefinitely. ~1 GB footprint keeps this cheap to reload.
keep_alive = "2h"
purpose = ["inline completion", "FIM", "quick syntax fixes"]
strengths = ["native FIM tokens", "very fast", "~1 GB footprint"]
weaknesses = ["no reasoning", "short context", "not for chat"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0


# Publisher supplies no separate sampling preset. Start with Qwen3.5's
# non-thinking general preset; no claim of an empirically optimal setting.
# https://huggingface.co/huihui-ai/Huihui-Qwen3.5-4B-abliterated
# https://huggingface.co/Qwen/Qwen3.5-4B#best-practices
# [APPROX] Bounded geometry for 16 GB; validation on a 64 GB host is not a
# measurement of a 16 GB machine. The installer imports the pinned MLX source.
[cyber]
role = "Unrestricted assistant (MLX 4B)"
active = "ailocal-qwen3.5-4b-uncensored:mlx-916d9f7"
source = { repository = "TheWirelessPhoenix/Qwen3.5-4B-abliterated_4bit", revision = "916d9f7c2e27ed41e2b9ed39f3a2badccb2bbc7c" }
preferred = ["ailocal-qwen3.5-4b-uncensored:mlx-916d9f7"]
reasoning = false
context_input = 12288
max_output = 4096
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
keep_alive = "5m"
purpose = ["benign refusal-sensitive work", "coding and tool-use candidate"]
strengths = ["community abliterated weights", "native MLX 4-bit"]
weaknesses = ["not measured on 16 GB hardware", "coding and tool reliability require evaluation"]

[compaction]
window = 79872  # effective window handed to the client's compactor
pct = 85  # compact at this % of the window
  # trigger: 67891 tokens
