# profile: 16gb
# Declarative capability registry for 16 GB unified memory (Apple Silicon).
#
# SHARED PRIMARY BACKEND. architecture, implementation, review and fast all resolve
# to ONE model (qwen3.5:4b). That is deliberate, not an oversight: on 16 GB there is
# room for one resident agent model, and rotating several role-specific models would
# spend the tier's whole memory budget on load/evict churn. The capability aliases
# still differ — persona, sampling, reasoning and num_predict are per-capability —
# they simply share a backend. One model resident, no swapping.
#
# ONE SHARED num_ctx, NOT FOUR. qwen3.5 runs on the llama_cpp runner, where
# num_ctx is a FIXED RUNNER WINDOW set at first load and an over-long prompt is
# TRUNCATED FROM THE FRONT with HTTP 200 and no error to the caller
# (registry.yaml, runtime_engines.llama_cpp). Four roles sharing one backend must
# declare an IDENTICAL total_context, or whichever loads the runner first
# silently decides the window for the other three. The roles below differ in
# context_input (90112 vs 102400) while max_output offsets it (16384 vs 4096) to
# the same 106496 total: the split is a role boundary, the total is a runner
# constraint.
#
# THIS IS THE ONE TIER WHERE MEMORY, NOT LATENCY, SETS THE CEILING. KV is
# allocated EAGERLY for the whole declared window and again per parallel slot.
# [REAL] qwen3.5:4b costs ~22.7 KB per ctx-token; with OLLAMA_NUM_PARALLEL=2,
# num_ctx 106496 holds ~7.4 GiB (weights ~2.8 GiB + 2 x 2.3 GiB KV) whether or not
# it is used. Adding the FIM model and embeddings puts the tier near 8.8 GiB of
# 16 GB, leaving macOS its share. num_ctx 131072+ would cost ~8.5 GiB for the
# primary alone and was rejected on that basis, NOT on model capability --
# qwen3.5:4b supports 262144 natively.
#
# max_output 16384 is why the total is 106496 rather than 98304: an output
# ceiling is charged eagerly here, so 8K of extra headroom costs ~370 MB even
# when nothing generates that long. `fast` keeps 4096 -- it answers in a word or
# two, and it is the role with documented runaway behaviour.
#
# num_predict is a generation CEILING, not an expected output length and not an
# extra fixed allocation.
#
# Field meanings are documented in profiles/64gb.toml, the reference schema.
# 16 GB is the minimum supported tier. Quality is below the larger tiers by design.
status = "configuration-verified"  # schema, selection and size are tested; not measured on 16 GB hardware
disk_gb = 6

[architecture]
role = "Lead architect (shared primary)"
active = "qwen3.5:4b"
preferred = ["qwen3.5:4b"]
reasoning = true
context_input = 90112
max_output = 16384
temperature = 0.1
keep_alive = "6h"
persona = true
purpose = ["architecture", "refactoring", "multi-step debugging", "design"]
strengths = ["shared resident primary - no load/evict churn", "native tool calling", "88K input, 16K output"]
weaknesses = ["smaller than the 64 GB tier's specialised models", "one backend serves four roles"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[implementation]
role = "Daily coding (shared primary)"
active = "qwen3.5:4b"
preferred = ["qwen3.5:4b"]
reasoning = false
context_input = 90112
max_output = 16384
temperature = 0.1
keep_alive = "6h"
persona = true
purpose = ["everyday coding", "features", "tests"]
strengths = ["same resident backend as architecture - no reload between roles"]
weaknesses = ["shares its budget with every other chat capability"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[review]
role = "Code review (shared primary)"
active = "qwen3.5:4b"
preferred = ["qwen3.5:4b"]
reasoning = true
context_input = 90112
max_output = 16384
temperature = 0.2
keep_alive = "6h"
persona = true
purpose = ["code review", "bug detection", "security review"]
strengths = ["reasoning enabled for review depth", "no separate model to load"]
weaknesses = ["not a dedicated review model as on the 64 GB tier"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[fast]
role = "Fast agent (shared primary)"
active = "qwen3.5:4b"
  # reasoning OFF for the same reason the 64 GB tier disables it on `fast`: a
  # classification tier that thinks past its budget returns empty content.
reasoning = false
preferred = ["qwen3.5:4b"]
context_input = 102400
max_output = 4096
temperature = 0.0
keep_alive = "6h"
persona = true
purpose = ["task classification", "summarisation", "quick edits", "tool-driven lookups"]
strengths = ["no extra model resident - shares the primary"]
weaknesses = ["larger than a dedicated 2b would be", "so marginally slower per token"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[completion]
role = "Autocomplete (FIM)"
  # SEPARATE MODEL ON PURPOSE. The primary is an instruct model without FIM/insert
  # tokens, so it cannot do inline completion at all, and IDE completion needs
  # latency the primary cannot meet. qwen2.5-coder carries native FIM tokens.
active = "qwen2.5-coder:1.5b"
preferred = ["qwen2.5-coder:1.5b"]
reasoning = false
context_input = 3968
max_output = 128
temperature = 0.1
  # Rotating, not pinned: self-unloads after 2h idle rather than staying resident
  # beside the primary indefinitely. ~1 GB footprint keeps this cheap to reload.
keep_alive = "2h"
persona = false
purpose = ["inline completion", "FIM", "quick syntax fixes"]
strengths = ["native FIM tokens", "very fast", "~1 GB footprint"]
weaknesses = ["no reasoning", "short context", "not for chat"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0

[embeddings]
role = "Embeddings"
active = "nomic-embed-text"
  # ollama, NOT ollama_chat: LiteLLM has no embeddings route for the
  # chat provider — /v1/embeddings against it returns 'Unmapped LLM provider'.
provider = "ollama"
preferred = ["nomic-embed-text"]
  # 2048 is the model's REAL limit. Do not inherit a chat context here.
context_input = 2048
temperature = 0.0
keep_alive = -1
persona = false
purpose = ["semantic search", "retrieval"]
strengths = ["tiny", "fast", "well-understood"]
weaknesses = ["2048-token ceiling - chunk before embedding"]

# ── interactive compaction (client-native; ailocal does NOT summarise) ───────
# window x pct is what the CLIENT compacts at; it is NOT a model limit. The
# 90,112-token maximum above stays available for deliberate one-shot work.
#
# [REAL] cold prefill of qwen3.5:4b, measured on 64 GB M3 Max, nothing else
# resident, no shared prompt prefix:
#     7,113 tok ->   6.6s (1077 tok/s)
#    40,002 tok ->  56.2s ( 711 tok/s)
#    70,002 tok -> 127.8s ( 548 tok/s)
#
# WHY THIS IS HIGHER THAN A COLD-PREFILL BUDGET ALONE WOULD ALLOW: an
# interactive session grows incrementally and hits Ollama's prefix cache every
# turn, so the full cold cost above is paid on session RESUME, not per turn.
# Sizing the trigger for the resume case penalises every ordinary turn to protect
# the rare one. 67,584 leaves 22,528 tokens of admissible input in reserve for the
# compaction prompt, system instructions, tool schemas and persona injection.
#
# [UNVERIFIED] on 16 GB hardware, and this is the tier where that gap matters
# most: a 16 GB Mac is the slowest GPU ailocal supports, so a cold resume at this
# depth will cost materially more there than the figures above suggest.
[compaction]
window = 90112  # effective window handed to the client's compactor
pct = 75  # compact at this % of the window
  # trigger: 67584 tokens
