# 64 GB profile — validated on this hardware class.
#
# One resident model serves architecture, implementation and review; they differ
# only in context, output ceiling and reasoning. Ollama keeps a single copy in
# memory, so the three roles cost one model's VRAM rather than three.
#
# Engine behaviour (context enforcement, truncation) is owned by
# deploy/litellm/registry.yaml.
disk_gb = 40

# ── architecture — shared large-context coding/reasoning tier ─────────────────
# The one big-context capability every client shares (Claude Code, Codex, VS Code):
# design, deep reasoning, AND large interactive/agent prompts.
#
# [REAL] gemma4:26b-mlx supports 262144 natively (`ollama show`). The MLX runner
# allocates KV LAZILY -- measured identical resident size (16.01 GiB) when loaded
# at num_ctx 16384, 98304, 147456 and 262144 -- so a large declared window costs
# nothing until tokens actually occupy it, and KV then grows at 45.4 KB/token
# (16.49 GiB at 7,785 tokens -> 22.09 GiB at 137,233, cold, nothing else resident).
# A filled 147,456 window is therefore ~22.5 GiB of 64 GB. Memory is NOT the
# binding constraint here; cold prefill latency is, and compaction owns that.
#
# [REAL] Cold prefill RE-MEASURED on the MLX runner (ollama 0.32.13,
# num_predict 1, every prompt carrying a unique preamble so Ollama cannot reuse
# a cached KV prefix, nothing else resident):
#     34,017 tok ->  34.0 s (1002 tok/s)    133,899 tok -> 236.3 s (567 tok/s)
#     66,881 tok ->  83.2 s ( 804 tok/s)    166,571 tok -> 340.4 s (489 tok/s)
#                                           231,390 tok -> 560.9 s (412 tok/s)
# Measure the cache and you get a different answer: the same 231,390-token
# prompt takes 154 s when it shares a prefix with the previous one. Only the
# unique-preamble numbers above describe a cache miss, which is the case that
# hurts.
#
# Still super-linear -- throughput falls 2.4x from 34K to 231K -- but ~5x faster
# than the llama_cpp figures this profile used to reason from (27.8K -> 85 s,
# 57.8K -> 341 s, 87.8K -> 789 s). Those numbers justified holding input at
# 131072 and they no longer describe this runtime.
#
# WHY 163840 AND NOT 245760. The full native window fits arithmetically
# (245760 + 16384 = 262144), but a cache miss at that admission costs ~9.3 min
# of prefill, which is not an interactive agent turn. At 163840 the worst case
# is ~340 s cold, ~250 s at the compaction trigger, against ~236 s / ~190 s
# before: 25% more session history for ~30% more worst-case cold latency.
# 196608 (~450 s) was measured and rejected as the point where a cache miss
# stops being recoverable. 81,920 tokens of native window are left deliberately
# unexposed as operational headroom.
[architecture]
role = "Lead architect"
active = "gemma4:26b-mlx"
reasoning = true  # gpt-oss:20b HAS thinking; qwen3-coder did not
context_input = 163840
max_output = 32768
  # max_output raised 2026-08-21. [REAL] With no ceiling, gemma4 finished
  # real coding tasks in 2,337-5,175 tokens, so 8192 was not truncating
  # normal work -- but at the OLD sampling it looped, spending 13k-23k
  # CHARACTERS on reasoning and returning an EMPTY response 7 times in 25.
  # That failure is silent: the client sees a short answer, not an error.
  # A ceiling cannot fix looping, it only moves where the truncation lands,
  # so this is headroom, not a cure -- the sampling change is the cure.
  # Costs nothing: MLX allocates KV lazily, and num_ctx 196608 was verified
  # to load at 16.15 GiB resident, identical to a small window.
temperature = 1.0
keep_alive = "6h"
purpose = ["architecture", "complex refactoring", "multi-step debugging", "design", "repository-wide planning", "large interactive/agent prompts"]
strengths = ["160K input window shared across clients", "holds a whole subsystem in view", "strong code generation"]
weaknesses = ["slower", "cold prefill of a full window costs ~5.7 min on a cache miss", "KV grows to ~28 GiB when the window is filled"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
  # Google's published Gemma 4 setting, applied verbatim: temperature 1.0,
  # top_k 64, top_p 0.95. REPLACES the previous temp 0.1-0.2 / top_k 20,
  # which was chosen for run-to-run reproducibility. Two measurements drove
  # the change (2026-08-21, Ollama 0.32.14): sampling costs NOTHING in
  # throughput here -- draft acceptance was 0.79 at temp 0.1 and 0.77 at
  # temp 1.0, a gap far inside the run-to-run spread -- and Gemma 4 is
  # reported to degrade on coding when held far below its recommended
  # temperature. Reproducibility was being bought with quality, not speed.
  # Anything needing determinism should pass a per-request temperature
  # rather than pinning the whole role.
# ── implementation — everyday working coder ──────────────────────────────────
[implementation]
role = "Daily coding"
active = "gemma4:26b-mlx"
  # Same physical model as architecture, deliberately: this is a role boundary
  # (persona, sampling, output ceiling), not a model boundary.
  #
  # Same context_input as architecture, also deliberately. Context capacity and
  # role semantics are different concerns: review and implementation benefit from
  # seeing a whole change, and starving them of input bought nothing. The MLX
  # runner enforces context per-request (registry.yaml), so three roles declaring
  # three different num_ctx still share ONE resident copy of the weights -- the
  # differing windows cost no extra memory.
  # Capabilities: tools YES, insert YES, thinking NO.
reasoning = true
context_input = 131072
max_output = 32768
  # max_output raised 2026-08-21. [REAL] With no ceiling, gemma4 finished
  # real coding tasks in 2,337-5,175 tokens, so 8192 was not truncating
  # normal work -- but at the OLD sampling it looped, spending 13k-23k
  # CHARACTERS on reasoning and returning an EMPTY response 7 times in 25.
  # That failure is silent: the client sees a short answer, not an error.
  # A ceiling cannot fix looping, it only moves where the truncation lands,
  # so this is headroom, not a cure -- the sampling change is the cure.
  # Costs nothing: MLX allocates KV lazily, and num_ctx 196608 was verified
  # to load at 16.15 GiB resident, identical to a small window.
temperature = 1.0
keep_alive = "6h"
  # 6h, NOT -1. [REAL] keep_alive is LAST-WRITER-WINS on a shared model, and
  # architecture, implementation and review are all ONE resident
  # gemma4:26b-mlx. Measured 2026-08-21: a request carrying -1 set
  # expires_at to the year 2318, and a later 6h request reset it to +6h.
  # So the role used LAST governed the whole model -- and implementation is
  # the highest-frequency role, which meant 16 GiB stayed pinned forever
  # while architecture's 6h looked like the policy. Three roles sharing one
  # model must declare the SAME keep_alive or the shortest one is fiction.
purpose = ["implementation", "features", "refactoring", "tests", "shell", "python", "typescript"]
strengths = ["fast", "low memory", "excellent everyday code generation"]
weaknesses = ["architecture", "repository-wide planning"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
  # Google's published Gemma 4 setting, applied verbatim: temperature 1.0,
  # top_k 64, top_p 0.95. REPLACES the previous temp 0.1-0.2 / top_k 20,
  # which was chosen for run-to-run reproducibility. Two measurements drove
  # the change (2026-08-21, Ollama 0.32.14): sampling costs NOTHING in
  # throughput here -- draft acceptance was 0.79 at temp 0.1 and 0.77 at
  # temp 1.0, a gap far inside the run-to-run spread -- and Gemma 4 is
  # reported to degrade on coding when held far below its recommended
  # temperature. Reproducibility was being bought with quality, not speed.
  # Anything needing determinism should pass a per-request temperature
  # rather than pinning the whole role.
# ── review — code review / bug & security detection ──────────────────────────
[review]
role = "Code review"
active = "gemma4:26b-mlx"
reasoning = true  # thinking AND tools (deepseek had NO tools)
  # Full input AND full output. A review of a 128K change emits findings, not
  # bulk code -- but the MLX runner allocates KV lazily, so an unused output
  # ceiling costs nothing here, and a review that DOES have a lot to say should
  # not be truncated mid-finding. 16384 matches architecture for that reason.
context_input = 131072
max_output = 32768
  # max_output raised 2026-08-21. [REAL] With no ceiling, gemma4 finished
  # real coding tasks in 2,337-5,175 tokens, so 8192 was not truncating
  # normal work -- but at the OLD sampling it looped, spending 13k-23k
  # CHARACTERS on reasoning and returning an EMPTY response 7 times in 25.
  # That failure is silent: the client sees a short answer, not an error.
  # A ceiling cannot fix looping, it only moves where the truncation lands,
  # so this is headroom, not a cure -- the sampling change is the cure.
  # Costs nothing: MLX allocates KV lazily, and num_ctx 196608 was verified
  # to load at 16.15 GiB resident, identical to a small window.
temperature = 1.0
keep_alive = "6h"
  # 6h, NOT -1. [REAL] keep_alive is LAST-WRITER-WINS on a shared model, and
  # architecture, implementation and review are all ONE resident
  # gemma4:26b-mlx. Measured 2026-08-21: a request carrying -1 set
  # expires_at to the year 2318, and a later 6h request reset it to +6h.
  # So the role used LAST governed the whole model -- and implementation is
  # the highest-frequency role, which meant 16 GiB stayed pinned forever
  # while architecture's 6h looked like the policy. Three roles sharing one
  # model must declare the SAME keep_alive or the shortest one is fiction.
purpose = ["code review", "bug detection", "security review", "alternative solutions"]
strengths = ["careful analysis", "security awareness", "concrete findings"]
weaknesses = ["slower than the implementation tier", "not for bulk generation"]
top_p = 0.95
top_k = 64
repeat_penalty = 1.0
  # Google's published Gemma 4 setting, applied verbatim: temperature 1.0,
  # top_k 64, top_p 0.95. REPLACES the previous temp 0.1-0.2 / top_k 20,
  # which was chosen for run-to-run reproducibility. Two measurements drove
  # the change (2026-08-21, Ollama 0.32.14): sampling costs NOTHING in
  # throughput here -- draft acceptance was 0.79 at temp 0.1 and 0.77 at
  # temp 1.0, a gap far inside the run-to-run spread -- and Gemma 4 is
  # reported to degrade on coding when held far below its recommended
  # temperature. Reproducibility was being bought with quality, not speed.
  # Anything needing determinism should pass a per-request temperature
  # rather than pinning the whole role.
  # Reasoning is on here and nowhere else: review is the one tier where thinking
  # earns its latency. Per-request reasoning_effort is UNRELIABLE (BerriAI/litellm
  # #15059 maps it incorrectly for Ollama); the per-role default below works.
# ── fast — lightweight tool-enabled agent (NOT autocomplete) ────────────────
# Deliberately not the completion tier: this model exposes no FIM/insert
# capability, so inline autocomplete would fail QUIETLY.
[fast]
role = "Fast agent"
active = "qwen3.5:2b"
preferred = ["qwen3.5:2b"]
  # reasoning is off although the model supports it: with thinking enabled it
  # emitted ~19k reasoning characters and returned EMPTY content within its
  # budget. This tier answers in a word or two and must not think itself out.
reasoning = false
  # [REAL] qwen3.5:2b supports 262144 natively and is the cheapest model here by
  # a wide margin: cold prefill 45.8s at 70,002 tokens (1529 tok/s, vs 598 tok/s
  # for gemma4 at 137K). Unlike gemma4 this is a llama_cpp runner, which
  # allocates KV EAGERLY for the whole declared window and again per parallel
  # slot: ~11.6 KB per ctx-token x OLLAMA_NUM_PARALLEL=2, so num_ctx 135168 costs
  # ~3.7 GiB resident whether or not it is used. Cheap enough to stop rationing.
  # max_output 8192, not 16384: this tier stays concise by design.
context_input = 126976
max_output = 8192
temperature = 0.0
keep_alive = "20m"
  # No deploy/litellm/instructions/fast.md on purpose: this tier gets _core.md only, so
  # every extra system-prompt token is a larger share of its small budget. Adding
  # the file is enough to change that -- the injector needs no code change.
purpose = ["task classification", "doc summarisation", "quick edits", "tool-driven lookups"]
strengths = ["tiny footprint", "native tool calling", "124K input, 8K output", "fastest prefill of any tier model"]
weaknesses = ["no FIM/insert - cannot do inline autocomplete", "weaker on large refactors"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0
  # Low temperature: answers must be reproducible across runs.
# ── completion — inline autocomplete (FIM) ───────────────────────────────────
# STANDBY — not in active use. Zero recorded requests across every trace, and the
# only consumer (Continue) is not installed. Kept mapped so inline autocomplete
# works the moment Continue is installed, but no longer PINNED: keep_alive -1 was
# reserving memory permanently on a machine where paging is the known failure
# mode. qwen2.5-coder:3b remains the right model here — it is the only small one
# with BOTH `insert` (FIM) and `tools`, verified across six candidates.
[completion]
role = "Autocomplete (standby)"
active = "qwen2.5-coder:3b-instruct-q4_K_M"
preferred = ["qwen2.5-coder:3b-instruct-q4_K_M", "qwen2.5-coder:1.5b"]
context_input = 3968
  # max_output 512, raised from 128. A FIM suggestion is a few lines, not a
  # paragraph, but 128 truncated multi-line completions mid-block. 512 is
  # still far too small to be used as a chat role, which is the point.
max_output = 512
temperature = 0.1
keep_alive = "2h"
purpose = ["inline completion", "FIM", "quick syntax fixes", "small transforms"]
strengths = ["very fast", "tiny footprint", "native FIM tokens"]
weaknesses = ["no deep reasoning", "short context"]
top_p = 0.9
top_k = 20
repeat_penalty = 1.0
  # Low temperature: answers must be reproducible across runs.

[compaction]
window = 163840  # effective window handed to the client's compactor
  # Tracks architecture.context_input, which is what LiteLLM admits. Compacting
  # against anything larger schedules a turn the backend would reject.
pct = 85  # compact at this % of the window
  # trigger: 139264 tokens (~250 s of cold prefill on a cache miss)
