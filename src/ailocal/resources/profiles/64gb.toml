# One guide per exact backend, shared by all capability aliases using it.
[model_guidance."gemma4:26b-mlx"]
prompting = ["Retrieve the relevant subsystem before requesting a change; a large window is not a reason to read an entire repository.","Use actual tool calls for inspection and edits, then verify the requested behavior with the client's tools."]
limitations = ["Cold prefill can take minutes near the admitted window; keep stable context and avoid unnecessary rereads.","Reasoning can exhaust output without a final answer; an empty or truncated reply is incomplete, not success."]
evidence = "[REAL] Local prefill and memory measurements inform this profile. [UNVERIFIED] These prompting suggestions have not been shown to improve repository task accuracy."
summary = "Gemma 4 26B MLX: shared coding and reasoning weights; capability aliases select different context budgets."
sources = ["https://huggingface.co/google/gemma-4-26B-A4B-it"]

[model_guidance."qwen3.5:9b-mlx"]
