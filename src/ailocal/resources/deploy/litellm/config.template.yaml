# Source for $AILOCAL_STATE/litellm/config.yaml.
# Generated by ailocal. Do not edit config.yaml directly.
#   Source:     this file + profiles/<tier>.toml + profiles/clients.toml
#   Source:     profiles/<active tier>.toml
#   Owner:      DevelopSolutions, LLC
#
# Hand-written policy that does not vary by hardware tier: router, auth,
# callbacks, dropped params, search. model_list and model_group_alias are empty
# here on purpose -- sync-models.py fills them between markers from the active
# profile.
#
# Required env (set in .env, passed via docker-compose):
#   LITELLM_MASTER_KEY   the single auth key every client uses
#   OLLAMA_URL           http://host.docker.internal:11434
#
# Model naming has two layers. Capabilities are canonical: one model_list entry
# each, named ailocal-<capability>. Compat names (claude-*, gpt-*) that clients
# hard-code become model_group_alias entries pointing at those groups, so there
# is no local/* namespace and one backend per capability. Personas are injected
# at request time, so compat names inherit them.
#
# Reference: https://docs.litellm.ai/docs/proxy/configs
model_list:

  # >>> BEGIN GENERATED model_list — do not edit <<<
  # >>> END GENERATED model_list <<<

router_settings:
  routing_strategy: least-busy
  num_retries: 0                    # single Ollama backend — retrying the same server immediately never helps
  timeout: 900                      # cover cold prompt-processing on large local contexts
  enable_pre_call_checks: true      # validate context window before sending
  allowed_fails: 2                  # cool down a model after 2 failures/min
  cooldown_time: 30                 # seconds before retrying a cooled-down model

  # ── Layer 2 aliases → capability groups ───────────────────────────────────
  # GENERATED from profiles/clients.yaml by sync-models.py — claude-*/gpt-* compat names,
  # each aliased to its ailocal-<capability> group.
  # Do NOT hand-edit between the markers — edit profiles/clients.yaml and run sync.
  # >>> BEGIN GENERATED model_group_alias — do not edit <<<
  # >>> END GENERATED model_group_alias <<<

  # NO FALLBACKS, DELIBERATELY.
  #
  # LiteLLM's `fallbacks` and `context_window_fallbacks` both reroute silently:
  # the client asks for one capability, gets a 200 from a different model, and
  # nothing in the response says so. A request answered by the 14B when the 30B
  # was selected has different cost, latency and quality, and the caller cannot
  # tell. Silent substitution is the failure mode this project refuses everywhere
  # else; it does not get an exception because LiteLLM makes it a one-line config.
  #
  # So a model that is unavailable, or a request that overflows its window, FAILS
  # — visibly, with the capability named. The caller then chooses a larger
  # capability on purpose. Capability windows are sized per hardware tier in
  # profiles/<tier>.yaml, which is where that decision belongs.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database. Single-user local proxy: master key from env, models from this
  # file. Spend logs / virtual keys / the /ui dashboard need a DB and are unused.
  # Matched to OLLAMA_NUM_PARALLEL (2). This was 1, which SERIALISED every request
  # at the proxy while Ollama still allocated two KV slots per model — paying the
  # memory cost of parallelism with none of the throughput. The two settings must
  # move together; raising this above OLLAMA_NUM_PARALLEL only queues inside
  # Ollama instead of inside LiteLLM.
  #
  # The prior comment ("Apple Silicon: queue inference; never split GPU") reflects
  # a real trade-off: concurrent requests share one GPU, so each is slower even
  # though total throughput rises. Revert to 1 if interactive latency regresses.
  max_parallel_requests: 2
  # background_health_checks are intentionally OFF — they reload every model on an
  # interval and thrash GPU memory. Check health on demand via /health.

litellm_settings:
  telemetry: false                  # no anonymous phone-home
  drop_params: true                 # strip params Ollama doesn't understand
  set_verbose: false
  # Callback modules are resolved RELATIVE TO THE CONFIG FILE unless given an
  # absolute path. The generated config lives under the runtime mount and the
  # hooks under the authored one, so these are absolute by necessity.
  callbacks:
    # Backport of a missing type guard in LiteLLM's own Anthropic success-logging
    # path. Two of its features collide: websearch interception converts a
    # streamed /v1/messages call to non-streaming and re-wraps the result in a
    # FakeAnthropicMessagesStreamIterator, which
    # _handle_anthropic_messages_response_logging then tries to validate as an
    # AnthropicResponse. Non-blocking (the client still gets its stream) but it
    # raises an ERROR traceback per request. Listed FIRST so the guard is in
    # place before any request is served. Self-retiring: it no-ops if a LiteLLM
    # upgrade fixes this upstream. See the module docstring for the repro.
    - /app/config/hooks/startup.proxy_handler_instance
    # Client compatibility endpoints LiteLLM does not implement. Claude Code
    # derives auxiliary Anthropic-shaped probes from ANTHROPIC_BASE_URL, so they
    # land here: `HEAD /api/hello` 404'd on every startup. Adds a static, unauth'd,
    # empty 200 on the live FastAPI app — no model call, no router lookup, and
    # nothing under /v1/* or the health routes is touched. See the module
    # docstring for the three client call sites and what this does NOT prove.
    # Translates reasoning_effort -> Ollama's native `think`. KEPT on a measured
    # A/B, not on the original issue (litellm#15059, fixed by #15465 and present
    # in 1.93.0). With the hook removed, reasoning_effort:"none" still produced
    # 1,828 characters of reasoning; with it, zero. That one level is the whole
    # justification — low/medium/high are indistinguishable either way. The
    # module docstring holds the table and the retirement condition. An explicit
    # `think` in the request still wins.
    - /app/config/hooks/reasoning_router.proxy_handler_instance
    # HISTORICAL: a `system_transport` hook used to sit here. LiteLLM's
    # Anthropic /v1/messages -> OpenAI adapter branched only on role
    # user/assistant, so a role:"system" entry inside the messages array fell
    # through the loop and was silently discarded — taking Claude Code's
    # SessionStart output, the Plan-mode gate and the subagent/skill
    # inventories with it. Fixed upstream in BerriAI/litellm#30443, which
    # first shipped in a stable release with 1.98.0. The hook and its module
    # were REMOVED at that upgrade, not disabled; do not restore them. The
    # behaviour they protected is asserted directly by the work-tracking
    # surface test, which is what would fail if a future image regressed it.
    # Restores context-window validation for local models. LiteLLM's
    # register_model strips the provider prefix from the key while the router's
    # pre-call check looks it up WITH the prefix, so max_input_tokens is never
    # enforced and oversized prompts are forwarded unvalidated. See the module
    # docstring for the full trace. Remove once fixed upstream.
    # Generic malformed tool-call recovery. Local models drift out of their
    # structured tool-call format and the runtime hands the whole call back as
    # plain text, stalling the agent loop. Measured here: qwen3-coder 25% -> 100%,
    # qwen2.5-coder 0% -> 100%, devstral untouched (hook never fires). ~0.1-0.2ms.
    # Known unfixed upstream bug: ollama/ollama#16686 (PR #16693 open, stale).
    # Model-agnostic by design - keep it even after upstream lands a fix.
    #
    # SECOND, DISJOINT DEFECT in the same hook - complete_ui_metadata().
    #   DEFECT    gemma4 emits a NATIVE, correctly-parsed Claude Code `Agent`
    #             call and omits the required `description`. The client returns
    #             InputValidationError and the model retries correctly, so the
    #             user sees "Invalid tool parameters" before every fresh
    #             delegation and pays a discarded round trip for it.
    #   OWNER     the model. Ollama renders the schema correctly (gemma4 can
    #             recite `description` as required) and its parser preserves the
    #             arguments; LiteLLM and ailocal never touch them.
    #   UPSTREAM  vllm-project/vllm#39072 - the same model omitting a different
    #             required field on an entirely different serving stack. Open,
    #             no fix, no maintainer response. No Ollama-side fix is possible
    #             today: tool schemas go into the PROMPT and are NOT
    #             grammar-constrained (ollama/ollama#6002).
    #   OBSERVED  ollama 0.32.13 (== latest stable), gemma4:26b-mlx AND
    #             non-MLX gemma4:26b. Direct /api/chat with the captured schema
    #             and production sampling: 10/10 omitted on both builds; a
    #             control tool with two required strings omitted 0/10. Real
    #             claude-local sessions: 8/17 first Agent calls. One measured
    #             recovery cost 18.0s and a discarded 14,474-token prefill.
    #   FIX       add `description` (first 5 words of the model's own prompt)
    #             when it is the ONLY missing required argument of `Agent`.
    #             Nothing else, no other tool, no other field.
    #   RETIRE    when the configured model emits required arguments reliably,
    #             or Ollama constrains tool arguments to the schema. Check with
    #             the direct /api/chat probe spelled out in that docstring.
    - /app/config/hooks/tool_repair.proxy_handler_instance
    - websearch_interception
    # Tool-payload measurement, and filtering when AILOCAL_TOOL_GATEWAY=filter.
    # Static per model, never per question: the schema set a model sees must not
    # depend on what was asked, or caching and reproducibility both break.
    - /app/config/hooks/tool_gateway.proxy_handler_instance
  # Rewrites a client's native web_search tool into a SearXNG call.
  #
  # enabled_providers matches the BACKEND deployment's provider, not the
  # inbound client's API dialect. Every model here is ollama_chat/*, so this
  # MUST be ollama_chat: `anthropic` matches nothing and silently disables web
  # search with no error logged. Do not delete the key or set it empty either --
  # both close every gate. Explicit provider names only.
  #
  # Anthropic's server_tool_use block is not re-emitted downstream, so clients
  # render a "0 searches" count even when retrieval worked.
  websearch_interception_params:
    enabled_providers:
      - ollama_chat
    search_tool_name: searxng-search
  # No response cache — coding agents almost never send byte-identical requests.

# ── Web search backend (SearXNG) ─────────────────────────────────────────────
# MUST be top-level: proxy_server.parse_search_tools() reads config["search_tools"]
# (falling back to general_settings.search_tools) and NEVER litellm_settings.
# Nesting it under litellm_settings silently yields zero registered tools, and
# every search then fails with "Search tool 'searxng-search' not found".
# api_base is resolved inside the container -> SearXNG must share ailocal_net.
# LiteLLM appends /search itself and always requests format=json.
search_tools:
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: http://searxng:8080
      # No result cap is available here: LiteLLM's SearXNG tool exposes no
      # max_results, so trimming must happen downstream. Raising engine counts
      # changes latency, not payload size.

# ── Cloud fallbacks (disabled by default) ────────────────────────────────────
# To enable: set the API key in .env and add a second model_list entry for the
# role OUTSIDE the generated markers, e.g.:
#   - model_name: coder-main
#     litellm_params:
#       model: anthropic/claude-sonnet-4-6
#       api_key: os.environ/ANTHROPIC_API_KEY
