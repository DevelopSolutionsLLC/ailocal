general:
  instance_name: "local-ai-search"
  debug: false

server:
  # 0.0.0.0 INSIDE the container only; compose publishes it as 127.0.0.1:8080,
  # so it is not reachable off this machine.
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "change_this_to_a_random_string_for_production"

  # Set explicitly to match upstream's default: the two locations for this
  # setting disagree, and being explicit removes the ambiguity.
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

outgoing:
  # SearXNG's own default is 3.0s, applied to every engine that doesn't override
  # it. github regularly exceeded that (measured: 3.2 s -> TimeoutException), so
  # the engine below raises its own. Left at the default here on purpose: a
  # global raise would let a genuinely dead engine hold up every search.
  request_timeout: 3.0

# ── Engine policy ───────────────────────────────────────────────────────────
#
# General web is the default for LiteLLM searches. Developer registries and
# research sources belong to their own categories and remain reachable by bang.
# Yahoo and Yep are keyless; Brave is enabled only when its optional key is set.
#
# Weights bias results toward documentation and standards over forum chatter.
use_default_settings:
  engines:
    keep_only:
      - google cse
      - duckduckgo
      - github
      - stackoverflow
      - wikipedia
      - askubuntu
      - superuser
      - mdn
      - pypi
      - npm
      - docker hub
      # Research tier, added 2026-08-03. All three are API-backed and keyless,
      # so they never take the scraper/CAPTCHA path. Chosen over wikipedia
      # because they populate results[] -- see the wikipedia note below.
      - arxiv
      - crossref
      # General-web tier. `braveapi` is the API-backed engine
      # (api.search.brave.com, X-Subscription-Token) and is NOT the same as
      # `brave`, which scrapes search.brave.com and takes no key. Upstream
      # ships braveapi `inactive: true` with an empty api_key, and it already
      # fails closed on its own: "No API key provided" is raised by the engine.
      - braveapi
      # Keyless general web, added for issue #8. Both declare
      # require_api_key: False in their engine source.
      - yahoo
      - yep
      - wiby
      # Code forges. github code takes a token; see its entry.
      - github code
      - codeberg
      - sourcehut
      # Package registries and model hub.
      - crates.io
      - pkg.go.dev
      - huggingface
      # Forums, keyless.
      - hackernews
      - meta.discourse
      # Research.
      - openalex
      # semantic scholar is deliberately absent: its public API rate-limits hard
      # enough that it returns nothing under normal use, which reads as a broken
      # engine rather than a throttled one.

engines:
  # ── Scraped general-web: opt-in only ────────────────────────────────────────
  #
  # Disabled by default: scraping becomes unreliable under sustained volume and
  # fails with CAPTCHAs, not errors. Enable one deliberately if Brave is absent.
  - name: google cse
    disabled: true

  # Second general-web source, so one provider's 429 does not mean zero results.
  - name: duckduckgo
    shortcut: ddg
    disabled: true

  # API-backed, no CAPTCHA, directly useful for coding queries.
  - name: github
    shortcut: gh
    categories: [it]
    timeout: 6.0
    disabled: false

  - name: stackoverflow
    shortcut: so
    categories: [it]
    disabled: false

  # Wikipedia returns infobox content that is not model-visible downstream, so it
  # adds latency without adding retrievable text.
  - name: wikipedia
    shortcut: wp
    categories: [general]
    disabled: true

  # ── API-backed engines ──────────────────────────────────────────────────────
  - name: askubuntu
    shortcut: ubuntu
    categories: [it]
    disabled: false
  - name: superuser
    shortcut: su
    categories: [it]
    disabled: false
  - name: mdn
    shortcut: mdn
    categories: [it]
    disabled: false
  - name: pypi
    shortcut: pypi
    categories: [it]
    disabled: false
  - name: npm
    shortcut: npm
    categories: [it]
    disabled: false
  - name: docker hub
    shortcut: dh
    categories: [it]
    disabled: false

  # ── Research tier ───────────────────────────────────────────────────────────
  #
  # Literature sources for design questions. Kept narrow: these are slow relative
  # to the coding engines and only earn their latency on research prompts.
  - name: arxiv
    shortcut: arx
    categories: [science]
    weight: 0.3
    disabled: false
  # Crossref asks for a contact address and paces unauthenticated callers. The
  # polite-pool mailto and a conservative timeout keep it from rate-limiting.
  - name: crossref
    shortcut: cr
    categories: [science]
    timeout: 30
    weight: 0.3
    disabled: false
  # semantic scholar is intentionally absent -- see the keep_only note above.

  # ── Keyless general web ─────────────────────────────────────────────────────
  #
  # The `general` category is what LiteLLM's web search queries -- it sends no
  # categories. Before issue #8 the registries above were ALSO general, so a
  # question like "how long to boil an egg" came back as npm packages. Now
  # general is Brave plus two keyless scrapers, so one provider's 429 or an
  # absent Brave key no longer means zero web results.
  - name: yahoo
    shortcut: yh
    categories: [general]
    timeout: 6.0
    disabled: false
  - name: yep
    shortcut: yep
    categories: [general]
    timeout: 6.0
    disabled: false
  # Small-web index: niche results, so bang-only (!wib), not in general.
  - name: wiby
    shortcut: wib
    disabled: true

  # ── Code forges and registries (category: it, reached with !it or a bang) ──
  # github code needs a token: GitHub's code-search API rejects anonymous calls.
  # The token is rendered from GITHUB_SEARCH_TOKEN like the Brave key; without
  # one the engine renders inactive. Use a fine-grained, public-repositories,
  # read-only token -- never the gh CLI token, which carries `repo` scope.
  - name: github code
    shortcut: ghc
    categories: [it]
    timeout: 6.0
    ghc_auth:
      type: personal_access_token
      token: "__GITHUB_SEARCH_TOKEN__"
    inactive: false
    disabled: false
  # Measured 3.0s timeout at the global default (2026-10-18); give it room.
  - name: codeberg
    shortcut: cb
    categories: [it]
    timeout: 8.0
    disabled: false
  - name: sourcehut
    shortcut: srht
    categories: [it]
    disabled: false
  # GitLab is absent on purpose: "unexpected crash" in this image (2026-10-18).
  - name: crates.io
    shortcut: crates
    categories: [it]
    disabled: false
  - name: pkg.go.dev
    shortcut: pgo
    categories: [it]
    disabled: false
  - name: huggingface
    shortcut: hf
    categories: [it]
    disabled: false

  # ── Forums (category: social media, reached with !social or a bang) ────────
  - name: hackernews
    shortcut: hn
    categories: [social media]
    disabled: false
  # One entry per Discourse forum; add more with a different base_url.
  - name: meta.discourse
    engine: discourse
    shortcut: dmeta
    base_url: "https://meta.discourse.org/"
    categories: [social media]
    disabled: false

  # ── Research (category: science) ───────────────────────────────────────────
  - name: openalex
    shortcut: oa
    categories: [science]
    timeout: 6.0
    disabled: false

  # ── General web: Brave Search API ───────────────────────────────────────────
  #
  # The default general-web source: an API key instead of scraping, so it does
  # not CAPTCHA. The key is injected at render time from the environment -- this
  # file is a template and must never contain the secret.
  - name: braveapi
    engine: braveapi
    shortcut: brv
    categories: [general, web]
    api_key: "__BRAVE_API_KEY__"
    inactive: false
    disabled: false

ui:
  show_about: false
  show_search_log: false

logging:
  level: warning
