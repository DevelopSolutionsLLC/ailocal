# Qwen3.5/3.8 render a completed tool-loop turn with no replayed reasoning as an
# empty think block, the non-thinking signature; the model then answers inside
# its open think block and ends the turn empty (#38). Omit that empty block only.
# RETIRE when upstream renders it so, or every client replays reasoning.
qwen35_patch_file = "qwen35-history.patch"
qwen35_patch_sha256 = "0b02b79201da852a53111a1a099d49ccabf1fb0b74b4c80227cede80dbdecf66"
# MLX's native decode loop ignored Options.Stop; enforce request-local stops
# before streaming or generating further turns, including split-token markers.
# Pinned 00cyre checkpoint declares INT8 routers inside its global INT4 config.
# Preserve those explicit overrides rather than trusting imported global metadata.
# https://huggingface.co/00cyre/Gemma-4-26B-A4B-it-Uncensored-MLX-4bit/blob/46ab84dbe20198a2ee5e66c3e69c039b8c60ad59/config.json

# The golang.org/x graph of the build, read by `ailocal audit`. security.patch
# raises x/net v0.61.0 -> v0.62.0 (2026-10-27), the first release outside
# GO-2026-6860/6866. Neither advisory reaches a 0.40.14 build, stock or patched
# (#83, 2026-11-05): govulncheck v1.9.0 source mode on the pinned tree reports
# them "required, not imported"; `go list -deps ./...` imports neither
# golang.org/x/net/html nor gabriel-vasile/mimetype (v1.4.16 has no requirements);
# and the stock binary contains no x/net/html symbol. The bump changes no linked
# code, so it is no reason to keep the patched runtime. The rest are stock
# v0.40.14's (https://raw.githubusercontent.com/ollama/ollama/v0.40.14/go.mod),
# listed so the audit covers them. x/crypto v0.58.0 stays inside GO-2026-5932
# (x/crypto/openpgp), which no package imports. go.sum in security.patch carries
# the sum.golang.org checksums for v0.62.0.
[security_dependencies]
"golang.org/x/net" = "v0.62.0"
"golang.org/x/image" = "v0.47.0"
"golang.org/x/text" = "v0.43.0"
"golang.org/x/crypto" = "v0.58.0"
"golang.org/x/sys" = "v0.49.0"
"golang.org/x/term" = "v0.47.0"
"golang.org/x/mod" = "v0.42.0"
"golang.org/x/sync" = "v0.24.0"
