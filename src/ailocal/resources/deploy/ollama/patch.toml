# required SwitchGLU, mixed-precision router, stop and three Qwen3.5 history
# regressions passed with no failures; 11 optional vendor tests skipped.
version = "0.40.14-ailocal.18631.1"
source_commit = "9a3e8177767245acc62b735eba7d5d8a553606d0"
