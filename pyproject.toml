[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ailocal"
version = "0.1.0"
description = "Run Claude Code, Codex CLI and VS Code Copilot Chat against local models on Apple Silicon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "DevelopSolutions, LLC" }]

# Deliberately empty, and checked by the gate. The host interpreter must be able
# to run ailocal with no virtual environment: every shell entry point calls
# python3 directly, and `ailocal test` runs on a bare interpreter. Adding a
# dependency here means owning a venv lifecycle across install, doctor, update
# and teardown -- see ADR 009.
dependencies = []

[project.scripts]
ailocal = "ailocal.cli:main"


# Shipped static assets travel INSIDE the package, so a wheel or a pipx
# installation carries everything `ailocal install` needs to provision. They are
# never imported: install.provision() copies them into the managed data root,
# and every consumer reads them from there.
[tool.setuptools.package-data]
ailocal = ["resources/**"]

# The proxy hooks are executed inside the container, so running the stack from a
# checkout leaves __pycache__ under resources/. Without this, a wheel built from
# a working tree ships stale bytecode for a different interpreter.
[tool.setuptools.exclude-package-data]
ailocal = ["resources/**/__pycache__/*", "resources/**/*.pyc"]

# resources/ holds data, not importable modules. Without this, setuptools finds
# the hook directories (they contain .py files) and installs them as top-level
# packages named `deploy`, `litellm`, `hooks`.
[tool.setuptools.packages.find]
where = ["src"]
include = ["ailocal*"]
exclude = ["ailocal.resources*"]
