# LiteLLM Proxy Configuration for ailocal
# Reference: https://docs.litellm.ai/docs/proxy/configs
#
# Required env vars (set in .env, passed via docker-compose):
#   LITELLM_MASTER_KEY  — the single auth key all clients use
#   OLLAMA_URL          — http://host.docker.internal:11434
#
# ── How model names work ─────────────────────────────────────────────────────
#   Layer 1 — Capabilities (canonical). ONE model_list entry each, named
#             `ailocal-<capability>`, GENERATED from the active config/profiles/<tier>.yaml
#             by sync-models.py, between markers. Agents/clients request these:
#               ailocal-architecture | ailocal-implementation | ailocal-review
#               | ailocal-completion | ailocal-embeddings
#   Layer 2 — Claude/OpenAI compat names (claude-*/gpt-*) that clients hard-code.
#             GENERATED from config/clients.yaml into model_group_alias (below),
#             each pointing at its `ailocal-<capability>` group. There is NO `local/*`
#             namespace — one canonical name per capability, one backend, one persona.
#
# Persona note: capabilities point straight at their base Ollama model. The persona
# is injected at request time by the persona_injector hook (see
# config/litellm/persona_injector.py + config/instructions/<capability>.md). Because
# compat names resolve to the capability's model group, every one inherits that
# persona automatically.
#
# ── Backend mapping (64gb profile) — the real model is never hidden ──────────
#   architecture   → qwen3-coder:30b                            (heavy design/refactor)
#   implementation → qwen2.5-coder:14b-instruct-q4_K_M          (everyday coding)
#   review         → deepseek-coder-v2:16b-lite-instruct-q4_K_M (review / bug / security)
#   completion     → qwen2.5-coder:3b-instruct-q4_K_M           (FIM autocomplete; fast)
#   embeddings     → nomic-embed-text                           (retrieval; infrastructure)
#
# DO NOT hand-edit the generated blocks — edit config/profiles/<tier>.yaml + config/clients.yaml
# then run ./scripts/sync-models.sh.

model_list:

  # >>> BEGIN GENERATED model_list (sync-models.py) — do not edit <<<

  # ailocal-architecture — Lead architect (qwen3-coder:30b)
  - model_name: ailocal-architecture
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: os.environ/OLLAMA_URL
      num_ctx: 32768
      temperature: 0.2
      keep_alive: -1
      additional_drop_params: ["thinking", "reasoning_effort"]
      think: false
    model_info:
      supports_function_calling: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_system_messages: true
      supports_native_streaming: true
      supports_reasoning: false
      max_input_tokens: 32768
      max_output_tokens: 8192
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ailocal-implementation — Daily coding (qwen2.5-coder:14b-instruct-q4_K_M)
  - model_name: ailocal-implementation
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL
      num_ctx: 16384
      temperature: 0.2
      num_predict: -1
      keep_alive: 20m
      additional_drop_params: ["thinking", "reasoning_effort"]
      think: false
    model_info:
      supports_function_calling: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_system_messages: true
      supports_native_streaming: true
      supports_reasoning: false
      max_input_tokens: 16384
      max_output_tokens: 4096
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ailocal-review — Code review (deepseek-coder-v2:16b-lite-instruct-q4_K_M)
  - model_name: ailocal-review
    litellm_params:
      model: ollama_chat/deepseek-coder-v2:16b-lite-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL
      num_ctx: 16384
      temperature: 0.1
      num_predict: 2048
      keep_alive: 20m
      additional_drop_params: ["thinking", "reasoning_effort"]
      think: false
    model_info:
      supports_function_calling: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_system_messages: true
      supports_native_streaming: true
      supports_reasoning: false
      max_input_tokens: 16384
      max_output_tokens: 4096
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ailocal-completion — Autocomplete (qwen2.5-coder:3b-instruct-q4_K_M)
  - model_name: ailocal-completion
    litellm_params:
      model: ollama_chat/qwen2.5-coder:3b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL
      num_ctx: 4096
      temperature: 0
      num_predict: 128
      keep_alive: -1
      additional_drop_params: ["thinking", "reasoning_effort"]
      think: false
    model_info:
      supports_function_calling: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_system_messages: true
      supports_native_streaming: true
      supports_reasoning: false
      max_input_tokens: 4096
      max_output_tokens: 1024
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: ailocal-embeddings
    litellm_params:
      model: ollama_chat/nomic-embed-text
      api_base: os.environ/OLLAMA_URL
      num_ctx: 8192
      keep_alive: -1
    model_info:
      mode: embedding
      max_tokens: 8192
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ailocal-vscode-chat — IDE chat (qwen3-coder:30b)
  - model_name: ailocal-vscode-chat
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: os.environ/OLLAMA_URL
      num_ctx: 65536
      temperature: 0.1
      num_predict: 4096
      keep_alive: 20m
      additional_drop_params: ["thinking", "reasoning_effort"]
      think: false
    model_info:
      supports_function_calling: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_system_messages: true
      supports_native_streaming: true
      supports_reasoning: false
      max_input_tokens: 65536
      max_output_tokens: 16384
      input_cost_per_token: 0
      output_cost_per_token: 0

  # >>> END GENERATED model_list <<<


router_settings:
  routing_strategy: least-busy
  num_retries: 0                    # single Ollama backend — retrying the same server immediately never helps
  timeout: 900                      # cover cold prompt-processing on large local contexts
  enable_pre_call_checks: true      # validate context window before sending
  allowed_fails: 2                  # cool down a model after 2 failures/min
  cooldown_time: 30                 # seconds before retrying a cooled-down model

  # ── Layer 2 aliases → capability groups ───────────────────────────────────
  # GENERATED from config/clients.yaml by sync-models.py — claude-*/gpt-* compat names,
  # each aliased to its ailocal-<capability> group.
  # Do NOT hand-edit between the markers — edit config/clients.yaml and run sync.
  # >>> BEGIN GENERATED model_group_alias (sync-models.py) — do not edit <<<
  model_group_alias:
    claude-opus-4-8: ailocal-architecture
    claude-opus-4-8-20251101: ailocal-architecture
    claude-fable-5: ailocal-review
    claude-sonnet-4-6: ailocal-implementation
    claude-sonnet-4-6-20250219: ailocal-implementation
    gpt-5.5: ailocal-implementation
    claude-haiku-4-5: ailocal-completion
    claude-haiku-4-5-20251001: ailocal-completion
    gpt-4o: ailocal-completion
    gpt-4o-mini: ailocal-completion
    gpt-3.5-turbo: ailocal-completion
  # >>> END GENERATED model_group_alias <<<

  fallbacks:
    # Capability hierarchy — degrade by tier when a model is unavailable.
    # Group names are the canonical `ailocal-<capability>` model_list entries.
    - {"ailocal-architecture":   ["ailocal-implementation", "ailocal-completion"]}
    - {"ailocal-review":         ["ailocal-implementation", "ailocal-completion"]}
    - {"ailocal-implementation": ["ailocal-completion"]}
  context_window_fallbacks:
    # Graceful fallback when a request exceeds a capability's declared window.
    - {"ailocal-architecture":   ["ailocal-implementation"]}
    - {"ailocal-review":         ["ailocal-implementation"]}
    - {"ailocal-implementation": ["ailocal-completion"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database. Single-user local proxy: master key from env, models from this
  # file. Spend logs / virtual keys / the /ui dashboard need a DB and are unused.
  max_parallel_requests: 1          # Apple Silicon: queue inference; never split GPU
  # background_health_checks are intentionally OFF — they reload every model on an
  # interval and thrash GPU memory. Check health on demand via /health.

litellm_settings:
  telemetry: false                  # no anonymous phone-home
  drop_params: true                 # strip params Ollama doesn't understand
  set_verbose: false
  # persona_injector merges each role's baked "Opus-like" persona into the
  # client's system message (a Modelfile SYSTEM alone is overridden whenever the
  # client sends its own system prompt). See config/litellm/persona_injector.py.
  callbacks: persona_injector.proxy_handler_instance
  # No response cache — coding agents almost never send byte-identical requests.

# ── Cloud fallbacks (disabled by default) ────────────────────────────────────
# To enable: set the API key in .env and add a second model_list entry for the
# role OUTSIDE the generated markers, e.g.:
#   - model_name: coder-main
#     litellm_params:
#       model: anthropic/claude-sonnet-4-6
#       api_key: os.environ/ANTHROPIC_API_KEY
