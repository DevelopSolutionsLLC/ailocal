# config.template.yaml — the SOURCE for config/litellm/config.yaml.
#
# Everything here is hand-written policy that does not vary by hardware tier:
# router settings, auth, callbacks, dropped params, SearXNG. The model_list and
# model_group_alias regions below are EMPTY on purpose — sync-models.py fills
# them from config/profiles/<tier>.yaml and config/clients.yaml.
#
# config.yaml itself is GENERATED and git-ignored. Edit this file, then run
# `ailocal sync`. Editing the generated file loses the edit on the next sync.
# Reference: https://docs.litellm.ai/docs/proxy/configs
#
# Required env vars (set in .env, passed via docker-compose):
#   LITELLM_MASTER_KEY  — the single auth key all clients use
#   OLLAMA_URL          — http://host.docker.internal:11434
#
# ── How model names work ─────────────────────────────────────────────────────
#   Layer 1 — Capabilities (canonical). ONE model_list entry each, named
#             `ailocal-<capability>`, GENERATED from the active config/profiles/<tier>.yaml
#             by sync-models.py, between markers. Agents/clients request these:
#               ailocal-architecture | ailocal-implementation | ailocal-review
#               | ailocal-completion | ailocal-embeddings
#   Layer 2 — Claude/OpenAI compat names (claude-*/gpt-*) that clients hard-code.
#             GENERATED from config/clients.yaml into model_group_alias (below),
#             each pointing at its `ailocal-<capability>` group. There is NO `local/*`
#             namespace — one canonical name per capability, one backend, one persona.
#
# Persona note: capabilities point straight at their base Ollama model. The persona
# is injected at request time by the persona_injector hook (see
# config/litellm/persona_injector.py + config/instructions/<capability>.md). Because
# compat names resolve to the capability's model group, every one inherits that
# persona automatically.
#
# ── Backend mapping (64gb profile) — the real model is never hidden ──────────
#   architecture   → qwen3-coder:30b-a3b-q4_K_M               (heavy design/refactor)
#   implementation → qwen2.5-coder:14b-instruct-q4_K_M          (everyday coding)
#   review         → deepseek-coder-v2:16b-lite-instruct-q4_K_M (review / bug / security)
#   completion     → qwen2.5-coder:3b-instruct-q4_K_M           (FIM autocomplete; fast)
#   embeddings     → nomic-embed-text                           (retrieval; infrastructure)
#
# DO NOT hand-edit the generated blocks — edit config/profiles/<tier>.yaml + config/clients.yaml
# then run ./scripts/sync-models.sh.

model_list:

  # >>> BEGIN GENERATED model_list (sync-models.py) — do not edit <<<
  # >>> END GENERATED model_list <<<


router_settings:
  routing_strategy: least-busy
  num_retries: 0                    # single Ollama backend — retrying the same server immediately never helps
  timeout: 900                      # cover cold prompt-processing on large local contexts
  enable_pre_call_checks: true      # validate context window before sending
  allowed_fails: 2                  # cool down a model after 2 failures/min
  cooldown_time: 30                 # seconds before retrying a cooled-down model

  # ── Layer 2 aliases → capability groups ───────────────────────────────────
  # GENERATED from config/clients.yaml by sync-models.py — claude-*/gpt-* compat names,
  # each aliased to its ailocal-<capability> group.
  # Do NOT hand-edit between the markers — edit config/clients.yaml and run sync.
  # >>> BEGIN GENERATED model_group_alias (sync-models.py) — do not edit <<<
  # >>> END GENERATED model_group_alias <<<

  # NO FALLBACKS, DELIBERATELY.
  #
  # LiteLLM's `fallbacks` and `context_window_fallbacks` both reroute silently:
  # the client asks for one capability, gets a 200 from a different model, and
  # nothing in the response says so. A request answered by the 14B when the 30B
  # was selected has different cost, latency and quality, and the caller cannot
  # tell. Silent substitution is the failure mode this project refuses everywhere
  # else; it does not get an exception because LiteLLM makes it a one-line config.
  #
  # So a model that is unavailable, or a request that overflows its window, FAILS
  # — visibly, with the capability named. The caller then chooses a larger
  # capability on purpose. Capability windows are sized per hardware tier in
  # config/profiles/<tier>.yaml, which is where that decision belongs.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database. Single-user local proxy: master key from env, models from this
  # file. Spend logs / virtual keys / the /ui dashboard need a DB and are unused.
  # Matched to OLLAMA_NUM_PARALLEL (2). This was 1, which SERIALISED every request
  # at the proxy while Ollama still allocated two KV slots per model — paying the
  # memory cost of parallelism with none of the throughput. The two settings must
  # move together; raising this above OLLAMA_NUM_PARALLEL only queues inside
  # Ollama instead of inside LiteLLM.
  #
  # The prior comment ("Apple Silicon: queue inference; never split GPU") reflects
  # a real trade-off: concurrent requests share one GPU, so each is slower even
  # though total throughput rises. Revert to 1 if interactive latency regresses.
  max_parallel_requests: 2
  # background_health_checks are intentionally OFF — they reload every model on an
  # interval and thrash GPU memory. Check health on demand via /health.

litellm_settings:
  telemetry: false                  # no anonymous phone-home
  drop_params: true                 # strip params Ollama doesn't understand
  set_verbose: false
  # persona_injector merges each role's baked "Opus-like" persona into the
  # client's system message (a Modelfile SYSTEM alone is overridden whenever the
  # client sends its own system prompt). See config/litellm/persona_injector.py.
  callbacks:
    # Backport of a missing type guard in LiteLLM's own Anthropic success-logging
    # path. Two of its features collide: websearch interception converts a
    # streamed /v1/messages call to non-streaming and re-wraps the result in a
    # FakeAnthropicMessagesStreamIterator, which
    # _handle_anthropic_messages_response_logging then tries to validate as an
    # AnthropicResponse. Non-blocking (the client still gets its stream) but it
    # raises an ERROR traceback per request. Listed FIRST so the guard is in
    # place before any request is served. Self-retiring: it no-ops if a LiteLLM
    # upgrade fixes this upstream. See the module docstring for the repro.
    - anthropic_stream_logging_fix.proxy_handler_instance
    # Client compatibility endpoints LiteLLM does not implement. Claude Code
    # derives auxiliary Anthropic-shaped probes from ANTHROPIC_BASE_URL, so they
    # land here: `HEAD /api/hello` 404'd on every startup. Adds a static, unauth'd,
    # empty 200 on the live FastAPI app — no model call, no router lookup, and
    # nothing under /v1/* or the health routes is touched. See the module
    # docstring for the three client call sites and what this does NOT prove.
    - compat_routes.proxy_handler_instance
    - persona_injector.proxy_handler_instance
    # Translates reasoning_effort -> Ollama's native `think`. LiteLLM 1.93.0
    # accepts reasoning_effort and drops it unmapped (BerriAI/litellm#15059):
    # measured `high` overlaps `none` entirely, so the control does nothing.
    # `think` IS forwarded and IS monotonic. An explicit `think` in the request
    # wins, so a manual override always beats this translation.
    - reasoning_router.proxy_handler_instance
    # Restores context-window validation for local models. LiteLLM's
    # register_model strips the provider prefix from the key while the router's
    # pre-call check looks it up WITH the prefix, so max_input_tokens is never
    # enforced and oversized prompts are forwarded unvalidated. See the module
    # docstring for the full trace. Remove once fixed upstream.
    - model_registrar.proxy_handler_instance
    # Generic malformed tool-call recovery. Local models drift out of their
    # structured tool-call format and the runtime hands the whole call back as
    # plain text, stalling the agent loop. Measured here: qwen3-coder 25% -> 100%,
    # qwen2.5-coder 0% -> 100%, devstral untouched (hook never fires). ~0.1-0.2ms.
    # Known unfixed upstream bug: ollama/ollama#16686 (PR #16693 open, stale).
    # Model-agnostic by design - keep it even after upstream lands a fix.
    - tool_repair.proxy_handler_instance
    - websearch_interception
    # Tool-payload measurement, and (only when AILOCAL_TOOL_GATEWAY=filter)
    # allowlist filtering of the tools a client declares. Default off: with the
    # env unset this hook returns on its first line and touches nothing.
    #
    # Registered LAST on purpose. websearch_interception rewrites the client's
    # web_search tool into a call against search_tools; if the gateway ran first
    # and dropped that tool, interception would have nothing to rewrite and web
    # search would fail silently. Running last means interception always sees
    # the client's full, unmodified tool list.
    #
    # tool_repair reads request_data["tools"] to validate recovered calls. It
    # therefore validates against the POST-filter list, which is correct — that
    # is what the model was actually told about.
    - tool_gateway.proxy_handler_instance
    # Session observation (Step 6 of the gateway work). Records what a session
    # asked for and which tools it actually called, to a ledger on disk. Purely
    # observational: it never mutates the request and never touches client
    # conversation state. Off unless AILOCAL_SESSION_LEDGER points somewhere
    # writable. Paired with scripts/diagnostics/verify-session.py, which supplies the
    # filesystem/git half that this container cannot see.
    - session_observer.proxy_handler_instance
    # Per-request timeline: request id, ttfb, total, finish/stop reason, and the
    # exception + traceback on failure. Off unless AILOCAL_TRACE_DIR is set.
    # Exists because the Claude "API error" was invisible to every component:
    # each one succeeded while the client timed out on a ~90 s silence.
    - request_trace.proxy_handler_instance
  # Rewrites a client's native web_search tool into a call against the
  # search_tools entry below.
  #
  # enabled_providers is matched against the BACKEND deployment's provider, NOT
  # the inbound client's API dialect. The router resolves it by stripping the
  # prefix off the chosen deployment's litellm_params.model (router.py:4358-4408
  # -> get_llm_provider), then passes it explicitly into anthropic_messages(), so
  # the "infer from model" fallback in the websearch handler never runs. Every
  # gate in websearch_interception/handler.py then tests that value.
  #
  # Every model here is ollama_chat/*, so this MUST be ollama_chat. It previously
  # read `anthropic` — reasoning from the fact that Claude Code speaks the
  # Anthropic Messages API — which matched nothing and silently disabled web
  # search entirely: the gates short-circuit before search detection runs, with
  # no error logged.
  #
  # Do NOT "fix" this by deleting the key. The handler's docstring claims None
  # enables all providers; the code does `self.enabled_providers =
  # [LlmProviders.BEDROCK.value]`. An empty list is equally wrong — `not in []`
  # is always true, closing every gate. Explicit provider names only.
  websearch_interception_params:
    enabled_providers:
      - ollama_chat
    search_tool_name: searxng-search
  # No response cache — coding agents almost never send byte-identical requests.

# ── Web search backend (SearXNG) ─────────────────────────────────────────────
# MUST be top-level: proxy_server.parse_search_tools() reads config["search_tools"]
# (falling back to general_settings.search_tools) and NEVER litellm_settings.
# Nesting it under litellm_settings silently yields zero registered tools, and
# every search then fails with "Search tool 'searxng-search' not found".
# api_base is resolved inside the container -> SearXNG must share ailocal_net.
# LiteLLM appends /search itself and always requests format=json.
search_tools:
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: http://searxng:8080
      # NO RESULT CAP IS AVAILABLE HERE — measured, then confirmed in source.
      #
      # A search returns 62 results = 17,939 B = ~4,484 tokens. Prompt eval is
      # the dominant latency term on this stack (ADR 013: ~600 tok/s at 16K on
      # the 30B), so an uncapped search costs ~7.5 s of prompt eval, and the
      # results persist in context for later turns, so it compounds. Capping
      # would be a real win.
      #
      # It cannot be done from here. LiteLLM's SearXNG transformer takes
      # `max_results` and explicitly discards it:
      #
      #   # Note: We could calculate pageno based on max_results, but for now
      #   # we'll ignore this and let SearXNG return its default results
      #   pass
      #     -- llms/searxng/search/transformation.py, LiteLLM 1.93.0
      #
      # Measured before reading that: setting max_results: 10 changed the
      # response by zero bytes. An `engines:` passthrough (the transformer does
      # forward unknown params) also changed nothing.
      #
      # The lever that DOES work is the SearXNG-side engine set in
      # deploy/searxng/settings.yml — result count is a function of how many
      # engines answer. Do not re-add max_results here expecting an effect;
      # re-check the transformer after a LiteLLM upgrade instead.

# ── Cloud fallbacks (disabled by default) ────────────────────────────────────
# To enable: set the API key in .env and add a second model_list entry for the
# role OUTSIDE the generated markers, e.g.:
#   - model_name: coder-main
#     litellm_params:
#       model: anthropic/claude-sonnet-4-6
#       api_key: os.environ/ANTHROPIC_API_KEY
