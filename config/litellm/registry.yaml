# registry.yaml — the Local Agent Gateway's capability registry.
#
# Single source of truth for what every MODEL can do, what every CLIENT sends,
# and what every ROUTE survives. The negotiator (tool_gateway.py) contains no
# knowledge of any specific model, client, or tool — it asks this file. If you
# find yourself adding an `if model == ...` downstream, the fact belongs here.
#
# ── Why the gateway, not the models, is the subject ─────────────────────────
# This file describes capability, not identity. A model class is matched by
# pattern, so swapping qwen3-coder for something else is a registry edit, not a
# code change — and a frontier/cloud model matched by `passthrough` is forwarded
# untouched. The gateway must remain useful when the models underneath it change,
# which means no assumption about any single one of them may live in code.
#
# ── What is NOT duplicated here ─────────────────────────────────────────────
# max_context comes from config/capabilities.generated.json, which sync-models.py
# generates from config/profiles/<tier>.yaml. Restating context windows here
# would create two sources that silently disagree after a profile change. The
# loader merges them; `max_context` below is only a fallback for a model class
# that has no generated entry (i.e. a cloud model).

version: 1

# ── Tool groups ─────────────────────────────────────────────────────────────
# Logical names, normalised across all three API dialects. A trailing '*' is a
# prefix match. Membership is a claim about what a tool is FOR, which is what
# lets a model or client select by need instead of by name.

groups:

  edit_and_run:
    - Bash
    - Read
    - Edit
    - Write
    - NotebookEdit
    - Glob
    - Grep
    - exec_command        # Codex
    - write_stdin
    - apply_patch
    - view_image

  search:
    - "mcp__grepai__*"
    - WebSearch
    - WebFetch
    - web_search

  lsp:
    - "mcp__lsp__*"

  mcp_plumbing:
    - ListMcpResourcesTool
    - ReadMcpResourceTool
    - ReadMcpResourceDirTool
    - list_mcp_resources
    - list_mcp_resource_templates
    - read_mcp_resource

  planning:
    - update_plan
    - create_goal
    - update_goal
    - get_goal

  orchestration:
    - Workflow            # measured 21,525 B — the largest single tool observed
    - DesignSync
    - Agent
    - SendMessage
    - Skill
    - ReportFindings
    - "Task*"
    - multi_agent_v1

  scheduling:
    - "Cron*"
    - Monitor
    - ScheduleWakeup
    - PushNotification

  worktree:
    - EnterWorktree
    - ExitWorktree

  interactive:
    - request_user_input

# Tools whose purpose is to change the tree. Used by the verification pipeline
# to decide whether "no filesystem delta" is suspicious. `ambiguous` ones can
# legitimately be read-only (a Bash that only greps), so they never on their own
# support a fabrication finding. Previously hard-coded in verify-session.py.
mutating_tools:
  definite:
    - Edit
    - Write
    - NotebookEdit
    - MultiEdit
    - apply_patch
  ambiguous:
    - Bash
    - exec_command
    - write_stdin

# ── Routes ──────────────────────────────────────────────────────────────────
# Facts about the transport, not about any model. `drops_tool_types` is LiteLLM's
# own behaviour when translating a dialect down to Chat Completions: those tools
# never reach a backend, so the gateway must not count removing them as a saving.
#
# Source: litellm/responses/litellm_completion_transformation/transformation.py
# on the 1.93.0 image (read, not inferred). Re-check after a LiteLLM upgrade.

routes:

  /v1/messages:
    dialect: anthropic
    call_types: [anthropic_messages]
    tools_key: tools
    tool_shape: "{name, description, input_schema}"
    drops_tool_types: []
    result_status: explicit        # tool_result carries is_error

  /v1/chat/completions:
    dialect: openai
    call_types: [completion, acompletion, chat_completion, text_completion]
    tools_key: tools
    tool_shape: "{type:function, function:{name, description, parameters}}"
    drops_tool_types: []
    # No error flag exists on this route. A result's status is UNKNOWN, never
    # success — absence of an error signal is not evidence of one.
    result_status: unknown

  /v1/responses:
    dialect: openai_responses
    call_types: [aresponses, responses]
    tools_key: tools
    tool_shape: "{type:function, name, description, parameters}"
    drops_tool_types: [computer_use, image_generation, namespace, shell]
    result_status: heuristic       # inspect function_call_output text

# ── Model classes ───────────────────────────────────────────────────────────
# Matched against the RESOLVED capability (via model_group_alias) first, then
# against the raw requested model name by pattern. First match wins.
#
# `passthrough: true` means the gateway measures and forwards, never filters —
# regardless of feature flags. Frontier models do not need their tools trimmed
# and must not be silently degraded.

model_classes:

  # ── Local: agentic ────────────────────────────────────────────────────────
  # REAL: qwen3-coder:30b-a3b-q4_K_M drove multi-step tool loops reliably
  # (16/16 agentic runs, 148 tool executions, and a clean Read->Edit repair of
  # calc.py in two calls under filtering).
  local_agentic:
    match_capabilities: [architecture]
    match_models: ["*qwen3-coder*"]
    supports_tools: true
    supports_mcp: true
    supports_parallel_tools: true
    supports_structured_output: true
    supports_reasoning: false      # Qwen's non-thinking variant; emits no <think>
    preferred_groups: [edit_and_run, search, lsp, mcp_plumbing, planning]
    denied_groups: [orchestration, scheduling, worktree, interactive]
    routing_hints:
      warmup: true                 # keep_alive -1; worth pre-warming
      notes: "Default target for agentic local work."

  # ── Local: weak at agentic loops ──────────────────────────────────────────
  # REAL: qwen2.5-coder:14b-instruct-q4_K_M was measured non-agentic. It is kept
  # available (it is a fine single-shot coder) but the registry declares the
  # limitation rather than encoding it in a conditional somewhere.
  local_nonagentic:
    match_capabilities: [implementation, review]
    match_models: ["*qwen2.5-coder:14b*", "*deepseek-coder-v2*"]
    supports_tools: true
    supports_mcp: false
    supports_parallel_tools: false
    supports_structured_output: false
    supports_reasoning: false
    preferred_groups: [edit_and_run, search]
    denied_groups: [orchestration, scheduling, worktree, interactive, lsp,
                    mcp_plumbing, planning]
    routing_hints:
      warmup: false
      notes: >
        Measured non-agentic: it does not sustain a multi-step tool loop. Given a
        narrow tool set it still edits competently. Prefer local_agentic for any
        task needing more than one or two calls.

  # ── Local: FIM autocomplete ───────────────────────────────────────────────
  # 4096-token window. Any conversational turn routed here 400s with "No models
  # have context window large enough"; a real agent turn cannot fit at all.
  local_completion:
    match_capabilities: [completion]
    supports_tools: false
    supports_mcp: false
    supports_parallel_tools: false
    supports_structured_output: false
    supports_reasoning: false
    preferred_groups: []
    denied_groups: []              # supports_tools:false already means "none"
    routing_hints:
      warmup: true
      notes: "FIM/autocomplete only. Never map a conversational alias here."

  local_embeddings:
    match_capabilities: [embeddings]
    supports_tools: false
    supports_mcp: false
    supports_parallel_tools: false
    supports_structured_output: false
    supports_reasoning: false
    preferred_groups: []
    denied_groups: []
    routing_hints:
      warmup: true
      notes: "Infrastructure: Cadence's semantic index depends on this."

  # ── Frontier / cloud: forward untouched ───────────────────────────────────
  # Deliberately last and deliberately passthrough. These have large context and
  # drive orchestration tools well; trimming their payload would remove
  # capability for no benefit. Listed so the gateway stays correct if a cloud
  # fallback is ever enabled, rather than filtering a frontier model by accident.
  frontier_passthrough:
    match_models: ["claude-*-2024*", "claude-*-2025*", "gpt-4*", "gpt-5*",
                   "o1*", "o3*", "*sonnet-4*", "*opus-4*"]
    passthrough: true
    supports_tools: true
    supports_mcp: true
    supports_parallel_tools: true
    supports_structured_output: true
    supports_reasoning: true
    max_context: 200000
    preferred_groups: []           # unused under passthrough
    denied_groups: []
    routing_hints:
      warmup: false
      notes: >
        Measure and forward, never filter. NOTE: ailocal's compat aliases
        (claude-sonnet-4-6, gpt-4o, ...) resolve to LOCAL capabilities through
        model_group_alias, and capability matching runs first — so those are
        correctly treated as local, not as frontier.

  # Anything unmatched. Fails open: measured, never modified. An unrecognised
  # model is a reason to change nothing.
  unknown:
    match_models: ["*"]
    passthrough: true
    supports_tools: true
    supports_mcp: true
    supports_parallel_tools: false
    supports_structured_output: false
    supports_reasoning: false
    preferred_groups: []
    denied_groups: []
    routing_hints:
      warmup: false
      notes: "Unmatched model — forwarded untouched by design."

# ── Schema rewrites (Phase C) ───────────────────────────────────────────────
# Reducing a tool's payload WITHOUT removing the tool. Applied only in filter
# mode, only to non-passthrough models, and never to protected tools.
#
# MEASURED on the real 104,202 B Claude Code payload:
#   descriptions          63,706 B  (61.1%)  <- the big prize, and the risky one
#   input_schema          37,364 B  (35.9%)
#     $schema              3,483 B           <- JSON Schema metadata
#     additionalProperties 1,134 B           <- ditto
#
# strip_keys removes keys a MODEL never reads. $schema and additionalProperties
# are validator metadata: they constrain a JSON Schema checker, not a language
# model choosing a tool. Removing them cannot change which tool the model picks.
#
# The description limits are a different bet: descriptions are how a model knows
# what a tool does, and truncating them could plausibly hurt tool selection in a
# way byte counts will not show. They default to null (disabled) and must not be
# enabled without an A/B on task success, not just on bytes.
schema_rewrites:
  defaults:
    enabled: true
    strip_keys: ["$schema", "additionalProperties"]
    max_description_chars: null
    max_param_description_chars: null
    truncation_marker: " ..."

# ── Task classes (Phase D) ──────────────────────────────────────────────────
# Automatic negotiation: instead of one static allowlist per client, infer what
# the TASK needs and send only that.
#
#   task -> classify -> required capabilities -> minimum viable tools
#
# HOW THE TASK IS READ, AND WHY THAT IS SAFE
# The classifier reads the FIRST user message only, which the proxy already sees.
# It never reads tool results or assistant turns: those are the model's own
# output, and letting them steer which tools remain available would let a
# confused model narrow its own capabilities mid-loop.
#
# WHY THIS IS OFF BY DEFAULT (AILOCAL_TASK_NEGOTIATION)
# Keyword classification of a natural-language request is a HEURISTIC. It will
# misread some tasks, and the cost of a miss is asymmetric: dropping a tool the
# task genuinely needed produces a stuck agent, while keeping an unnecessary tool
# only costs tokens. So:
#   - an unmatched task keeps everything the client/model rules already allow
#   - `always` groups are added to every classification, matched or not
#   - a classification only ever SUBTRACTS from what Phase B already permitted;
#     it can never grant a group the client or model disallows
#
# Patterns are matched case-insensitively as substrings, in listed order; the
# first class with a hit wins. `min_confidence_hits` requires that many distinct
# pattern matches before the class is accepted, so a single incidental word does
# not reclassify a whole session.

task_classes:

  # Groups every task keeps regardless of classification. Reading and running
  # things is the floor: a task that cannot read a file cannot be verified.
  always: [edit_and_run, mcp_plumbing]

  classes:

    - name: simple_edit
      min_confidence_hits: 1
      patterns: ["fix the typo", "rename ", "change the ", "replace ",
                 "add a comment", "update the string", "bump the version"]
      groups: []          # `always` alone: read + edit + run
      notes: >
        A narrow, located change. The task already names the file and the edit,
        so search and symbol tools add tokens without adding capability.

    - name: explore
      min_confidence_hits: 1
      patterns: ["where is", "how does", "find the", "search for", "which file",
                 "explain the", "trace ", "what calls", "look for"]
      groups: [search, lsp]
      notes: "Understanding existing code: semantic search plus symbols."

    - name: architecture
      min_confidence_hits: 1
      patterns: ["design ", "architecture", "refactor", "restructure",
                 "should we", "trade-off", "tradeoff", "migrate ", "plan the"]
      groups: [search, lsp, planning]
      notes: >
        Needs the widest read surface plus planning. Deliberately still excludes
        orchestration: spawning subagents is what local models drive worst.

    - name: debug
      min_confidence_hits: 1
      patterns: ["bug", "failing", "error", "stack trace", "traceback",
                 "why does", "broken", "crash", "regression"]
      groups: [search, lsp]
      notes: "Read widely, run tests, edit narrowly."

    - name: review
      min_confidence_hits: 1
      patterns: ["review", "audit", "security", "vulnerability", "code smell"]
      groups: [search, lsp]
      notes: "Read-heavy; mutation is incidental but not forbidden."

# ── Client profiles ─────────────────────────────────────────────────────────
# What each client sends and how it should be treated. `drop_groups` here is
# intersected with the model's own denied_groups: a tool is removed only when
# BOTH the client profile and the model class permit removing it, so neither
# side can unilaterally strip something the other needs.

clients:

  claude-code:
    detect:
      user_agent_contains: ["claude-cli"]
      headers: {x-app: cli}
    routes: [/v1/messages]
    # REAL: 61 tools / 104,202 B / 24,448 Qwen tokens observed on turn 1.
    observed_payload: {tools: 61, bytes: 104202, real_tokens: 24448}
    drop_groups: [orchestration, scheduling, worktree]
    keep_groups: [edit_and_run, search, lsp, mcp_plumbing, planning]
    warmup: [lsp, grepai]

  codex:
    detect:
      originator_contains: ["codex"]
      user_agent_contains: ["codex"]
    routes: [/v1/responses]
    # REAL: 16 tools / 38,388 B, but 27,168 B of that is namespace-typed and
    # dropped by LiteLLM before the backend. Attributable gain is ~18%, not 71%.
    observed_payload: {tools: 16, bytes: 38388, real_tokens: 8026}
    drop_groups: [orchestration, scheduling, interactive]
    keep_groups: [edit_and_run, search, lsp, mcp_plumbing, planning]
    warmup: [grepai]

  vscode:
    detect:
      user_agent_contains: ["vscode", "copilot", "continue"]
    routes: [/v1/chat/completions]
    # HYPOTHESIS: payload not yet captured from a real VS Code session. Until it
    # is, this profile drops nothing — see Phase H.
    observed_payload: null
    drop_groups: []
    keep_groups: []
    warmup: [grepai]

  unknown:
    detect: {}
    routes: []
    observed_payload: null
    # An unidentified client gets no filtering. Guessing at what it needs is how
    # a gateway breaks a tool nobody knew was load-bearing.
    drop_groups: []
    keep_groups: []
    warmup: []

# ── Never remove, whatever the rules say ────────────────────────────────────
# A hard floor checked after group logic. Each entry is here because removing it
# caused, or would cause, a silent failure rather than a visible one.
protected:
  # LiteLLM's websearch_interception rewrites the client's web_search tool into a
  # SearXNG call. Remove the tool and there is nothing to rewrite: search fails
  # silently. Codex sends it as a bare {"type":"web_search"} with NO name, which
  # is also why unnamed entries are never dropped.
  - web_search
  - WebSearch
