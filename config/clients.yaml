# clients.yaml — the semantic map generation can't infer.
#
# config/profiles/<tier>.yaml says WHAT each capability is. This says WHICH capability each client
# surface uses. Together they are the single source of truth: sync-models.py reads both and
# regenerates every client config + the LiteLLM alias block, so a future capability change never
# requires hand-editing a client file.
#
# Values on the right are capability names from the active profile. Flow-style lists.

# Claude Code
claude:
  launch_default: implementation
  # built-in slot -> capability. Also emitted into model_group_alias so `model: opus`
  # in a subagent (or a background Opus/Sonnet/Haiku call) routes to the right tier.
  # haiku is deliberately NOT `completion`. Claude Code uses its haiku slot for real
  # background work (post-tool processing, summarisation), not autocomplete — those
  # requests routinely carry the full conversation. Pointing it at the 4096-token FIM
  # model made every such call a hard 400: measured ContextWindowExceededError,
  # Max Input Tokens=4096, Got=12023. `completion` is FIM only; never a chat tier.
  # haiku -> fast, NOT implementation and emphatically NOT completion.
  #   completion (4096, FIM) is a hard 400 on any real turn — measured Got=12023.
  #   implementation works, but pointing two slots at one capability listed
  #   `ailocal-implementation` twice in the /model picker, and tied up the 14B on
  #   background summarisation.
  #   fast (qwen3.5:2b, 32768 ctx, native tools, persona) is built for exactly
  #   this traffic and had no consumer at all until now.
  slots: {opus: architecture, sonnet: implementation, haiku: fast, fable: review}

# Codex CLI
codex:
  default: implementation
  # named profiles (codex --profile plan / review)
  profiles: {plan: architecture, review: review}

# Continue (VS Code) — chat picker entries, the direct-Ollama FIM model, embeddings
continue:
  chat: [architecture, implementation, review]
  autocomplete: completion
  embeddings: embeddings

# External client compatibility names -> capability. These are NOT ailocal roles — they are model
# IDs that Claude Code and the OpenAI SDK hard-code and cannot be told to stop sending (e.g.
# claude-local background calls send claude-haiku-4-5). Without them those clients 404. The old
# ailocal role names (coder-main/coder-fast/coder-agent/deep-think*/supervisor/embed) are gone:
# agents and configs use capability names now.
compat:
  claude-opus-4-8: architecture
  claude-opus-4-8-20251101: architecture
  claude-fable-5: review
  claude-sonnet-4-6: implementation
  claude-sonnet-4-6-20250219: implementation
  gpt-5.5: implementation
  # See the note on claude.slots above: these are conversational model IDs, so they
  # must not resolve to the 4096-token FIM tier. Only `continue.autocomplete` should
  # ever point at `completion`.
  claude-haiku-4-5: fast
  claude-haiku-4-5-20251001: fast
  gpt-4o: implementation
  gpt-4o-mini: implementation
  gpt-3.5-turbo: implementation
