# profile: 64gb
# Declarative capability registry for 64 GB unified memory (Apple Silicon / M3 Max).
#
# Each entry is a CAPABILITY (intent), not a model name — but the real Ollama backend
# is always right here (`active`), never hidden. Agents request the capability; the
# router (LiteLLM) resolves it to `active`.
#
# Fields:
#   role         human label shown in `ailocal status`
#   active       the Ollama backend in use (what the generator emits, what runs)
#   preferred    evaluated alternatives, best first — a decision record. The generator
#                uses `active`; switching model is a one-line `active:` change. Keep the
#                others so six months from now you compare, not remember.
#   context      num_ctx
#   temperature / num_predict   sampling (forwarded to LiteLLM)
#   keep_alive   idle TTL AND the residency signal. `-1`/`forever`/`persistent` pin the model
#                (resident); a duration (e.g. 20m) lets it self-unload when idle (rotating).
#                Per-request keep_alive beats the global default.
#                This is the ONLY residency lever Ollama consumes; there is no separate priority
#                field (Ollama evicts LRU under OLLAMA_MAX_LOADED_MODELS pressure).
#   persona      persona_injector merges config/instructions/<capability>.md at request time.
#   purpose/strengths/weaknesses   why this model was chosen — read before swapping it.
#
# NOTE: capabilities are TOP-LEVEL keys (not nested under a `capabilities:` map) so the
# stdlib parser and the shell resolvers stay simple. Lists are flow-style [a, b, c].
# Run ./scripts/sync-models.sh after any change.

disk_gb: 40

# ── architecture — shared large-context coding/reasoning tier ─────────────────
# The one big-context capability every client shares (Claude Code, Codex, VS Code):
# design, deep reasoning, AND large interactive/agent prompts. 65536 num_ctx gives clients
# a genuinely large input window; qwen3-coder:30b-a3b-q4_K_M supports 262144, so 128K is a future
# "architecture-deep" capability, not this one (a resident -1 model carries its full KV,
# so 64K is the balance between input capacity and permanent memory).
architecture:
  role: Lead architect
  active: qwen3-coder:30b-a3b-q4_K_M
  # Rollback: qwen3-coder:30b-a3b-q4_K_M stays installed and listed here, so
  # reverting is a one-line `active:` change plus ./scripts/sync-models.sh.
  # PROMPT EVAL, corrected [REAL]: 971 tok/s on a cold 4,013-token prompt, vs
  # 353 for the dense 14b — ~2.75x faster, which is what matters because prompt
  # eval is the mechanism behind the Claude first-byte timeout.
  #
  # An earlier figure of 1705 tok/s was WRONG: it came from a best-of-2 loop that
  # selected the cached run. Re-sending an identical prompt reports the same
  # prompt_eval_count with the duration collapsing 4134 ms -> 16.8 ms, i.e.
  # 239,525 tok/s, because the KV cache is reused and nothing is evaluated.
  # Any prompt-eval measurement must use a COLD, large prompt.
  #
  # MEASURED: this is MoE — 128 experts, 8 used, ~3B ACTIVE params per token.
  # That is why it beats the dense qwen3.6:27b at 197 vs 90 chunks/s despite
  # being nominally larger. Daily coding velocity is the priority; the dense
  # model's thinking/vision did not pay for ~2x slower generation.
  preferred: [qwen3-coder:30b-a3b-q4_K_M]
  reasoning: false         # VERIFIED: no `thinking` capability on this model
  context: 65536
  temperature: 0.1
  num_predict: 16384
  keep_alive: -1
  persona: true
  purpose: [architecture, complex refactoring, multi-step debugging, design, repository-wide planning, large interactive/agent prompts]
  strengths: [large 64K input window shared across clients, holds a whole subsystem in view, strong code generation]
  weaknesses: [slower, higher resident memory (64K KV pinned), non-thinking (no <think> stream)]
  top_p: 0.9
  top_k: 20
  repeat_penalty: 1.0
  # SAMPLING RATIONALE
  #   temperature 0.1 / top_p 0.9 / top_k 20 — this is the PRIMARY CODING and
  #   agent model, not a separate design tier, so it wants determinism. An
  #   earlier revision used 0.3/0.95/40 on the assumption that architecture work
  #   wants exploration; that was the wrong reading of the role.
  #   repeat_penalty 1.0 = NO penalty, set explicitly rather than left to a
  #   backend default. Penalties hurt code, which legitimately repeats (imports,
  #   boilerplate, closing braces, similar error handlers).
  # THINKING
  #   MEASURED: qwen3-coder:30b-a3b has NO `thinking` capability
  #   (Ollama /api/show). Thinking cannot be enabled here at any setting. If
  #   reasoning is wanted on architecture work, that needs a different model —
  #   gpt-oss:20b reasons but its prompt eval is 261 vs 1705 tok/s, a 6.5x
  #   regression on the metric behind the Claude timeout failure.
# ── implementation — everyday working coder ──────────────────────────────────
implementation:
  role: Daily coding
  active: qwen2.5-coder:14b-instruct-q4_K_M
  # A genuinely separate tier from architecture: dedicated everyday coding at a
  # smaller footprint, so the 64K MoE is not tied up on routine edits.
  # VERIFIED capabilities: tools YES, insert YES, thinking NO.
  preferred: [qwen2.5-coder:14b-instruct-q4_K_M, qwen3-coder:30b-a3b-q4_K_M]
  reasoning: false         # VERIFIED: no `thinking` capability
  context: 16384
  temperature: 0.1
  num_predict: -1
  keep_alive: 20m
  persona: true
  purpose: [implementation, features, refactoring, tests, shell, python, typescript]
  strengths: [fast, low memory, excellent everyday code generation]
  weaknesses: [architecture, repository-wide planning]
  top_p: 0.9
  top_k: 20
  repeat_penalty: 1.0
  # SAMPLING RATIONALE
  #   temperature 0.1 — daily coding wants determinism, not creativity.
  #   ASSUMED starting point. No penalties, for the same reason as above.
  # THINKING
  #   MEASURED: qwen2.5-coder:14b has NO `thinking` capability. N/A here.
# ── review — code review / bug & security detection ──────────────────────────
review:
  role: Code review
  active: gpt-oss:20b
  preferred: [gpt-oss:20b, deepseek-coder-v2:16b-lite-instruct-q4_K_M]
  reasoning: true          # VERIFIED: thinking AND tools (deepseek had NO tools)
  context: 16384
  temperature: 0.2
  num_predict: 2048
  keep_alive: 20m
  persona: true
  purpose: [code review, bug detection, security review, alternative solutions]
  strengths: [careful analysis, security awareness, concrete findings]
  weaknesses: [slower than the implementation tier, not for bulk generation]
  top_p: 0.9
  top_k: 20
  repeat_penalty: 1.0
  # SAMPLING RATIONALE
  #   temperature 0.2 — review should be reproducible; two runs over the same
  #   diff should not disagree. ASSUMED starting point.
  # THINKING: ON by default, and this is the ONLY tier where it is.
  #   MEASURED: gpt-oss:20b reports `thinking`, and reasoning_content is
  #   produced through the proxy. Reasoning is the point of a review tier and
  #   latency is not critical there (307 ms ttft, 71.7 tok/s).
  #
  #   OVERRIDE CAVEAT [REAL]: reasoning_effort DOES reach the backend, but the
  #   mapping is unreliable — `none` produced 120 reasoning chars while `high`
  #   produced 54, i.e. inverted. This is BerriAI/litellm#15059 ("think
  #   parameter for Ollama models are not mapped correctly"). Treat per-request
  #   effort levels as UNRELIABLE until that lands; the per-role default below
  #   is the control that actually works.
# ── fast — lightweight tool-enabled agent (NOT autocomplete) ────────────────
# Deliberately NOT the completion tier. qwen3.5:4b has no FIM/insert capability
# (verified against Ollama metadata: no fim_prefix/fim_suffix/fim_middle markers,
# capabilities are completion/vision/tools/thinking with NO `insert`), so it
# cannot serve inline autocomplete. Putting it there would break Continue/VS Code
# infill *quietly* — the model would still answer, just never as a correct infill.
#
# What it IS good for: 262K context, native tool calling, and thinking, at 3.4 GB.
# That makes it the right home for cheap agentic work that currently runs on a
# far larger model — task classification, doc summarisation, quick single-file
# edits — freeing implementation/architecture for real coding.
fast:
  role: Fast agent
  active: qwen3.5:2b
  preferred: [qwen3.5:2b]
  # MEASURED 114 tok/s gen / 1056 tok/s prompt vs the 4b's 78 / 549 — fewer
  # params beat lighter quantization, so Q8_0 won on SPEED, not just quality.
  #
  # reasoning DELIBERATELY false despite the model supporting it: with thinking
  # on it emitted 19,056 reasoning characters and returned EMPTY content at both
  # max_tokens 8 and 64 (finish_reason=length). This tier answers one word; it
  # must not think itself out of its budget.
  reasoning: false
  context: 32768
  temperature: 0.0
  num_predict: 4096
  keep_alive: 20m
  # persona: true, but there is deliberately NO config/instructions/fast.md — this
  # tier receives _core.md ONLY. Verified 2026-07-28: the instructions directory
  # holds _core/architecture/implementation/review. A per-capability enhancer is
  # absent on purpose; this tier answers in a word or two and every extra token of
  # system prompt is a larger share of its budget than for any other tier. Add
  # fast.md if that changes — the injector picks it up with no code change.
  persona: true
  purpose: [task classification, doc summarisation, quick edits, tool-driven lookups]
  strengths: [tiny footprint, native tool calling, very long context, low latency]
  weaknesses: [no FIM/insert - cannot do inline autocomplete, weaker on large refactors]
  top_p: 0.9
  top_k: 20
  repeat_penalty: 1.0
  # SAMPLING RATIONALE
  #   temperature 0.0 — this tier emits one word. Any sampling variance is pure
  #   downside for a classifier.
  # THINKING: OFF, permanently, despite the model supporting it.
  #   MEASURED: with thinking enabled qwen3.5:2b emitted 19,056 reasoning
  #   characters and returned EMPTY content at BOTH max_tokens 8 and 64
  #   (finish_reason=length). It thinks past its budget and never answers.
# ── completion — inline autocomplete (FIM) ───────────────────────────────────
# STANDBY — not in active use. Zero recorded requests across every trace, and the
# only consumer (Continue) is not installed. Kept mapped so inline autocomplete
# works the moment Continue is installed, but no longer PINNED: keep_alive -1 was
# reserving memory permanently on a machine where paging is the known failure
# mode. qwen2.5-coder:3b remains the right model here — it is the only small one
# with BOTH `insert` (FIM) and `tools`, verified across six candidates.
completion:
  role: Autocomplete (standby)
  active: qwen2.5-coder:3b-instruct-q4_K_M
  preferred: [qwen2.5-coder:3b-instruct-q4_K_M, qwen2.5-coder:1.5b]
  context: 4096
  temperature: 0.1
  num_predict: 128
  keep_alive: 20m
  purpose: [inline completion, FIM, quick syntax fixes, small transforms]
  strengths: [very fast, tiny footprint, native FIM tokens]
  weaknesses: [no deep reasoning, short context]
  top_p: 0.9
  top_k: 20
  repeat_penalty: 1.0
  # SAMPLING RATIONALE
  #   temperature 0.1 — infill must match surrounding style, not invent.
  # THINKING: N/A (no capability). num_predict stays small: this tier is
  #   latency-bound, and a long completion is worse than a short correct one.
# ── embeddings — semantic retrieval (INFRASTRUCTURE) ─────────────────────────
embeddings:
  role: Semantic retrieval
  active: nomic-embed-text
  preferred: [nomic-embed-text, mxbai-embed-large]
  # 2048 is nomic-embed-text's REAL maximum. Measured: it silently CLIPS above this
  # and still returns a valid 768-dim vector, so 8192 advertised 4x the true capacity
  # and produced successful-looking embeddings of truncated text. Two inputs sharing
  # a prefix and differing only past the boundary embed BYTE-IDENTICALLY (cosine
  # 1.0000000000); a control differing inside the prefix does not (0.9833).
  context: 2048
  keep_alive: -1
  purpose: [semantic search, memory, retrieval for grepai]
  strengths: [always-on, tiny, grepai calls it directly on :11434]
  weaknesses: [not a chat model]

# ── reasoning tier (no installed backend) ────────────────────────────────────
