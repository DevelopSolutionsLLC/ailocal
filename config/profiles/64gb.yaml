# profile: 64gb
# Declarative capability registry for 64 GB unified memory (Apple Silicon / M3 Max).
#
# Each entry is a CAPABILITY (intent), not a model name — but the real Ollama backend
# is always right here (`active`), never hidden. Agents request the capability; the
# router (LiteLLM) resolves it to `active`. See docs/MODEL_ARCHITECTURE.md.
#
# Fields:
#   role         human label shown in `ailocal status`
#   active       the Ollama backend in use (what the generator emits, what runs)
#   preferred    evaluated alternatives, best first — a decision record. The generator
#                uses `active`; switching model is a one-line `active:` change. Keep the
#                others so six months from now you compare, not remember.
#   context      num_ctx
#   temperature / num_predict   sampling (forwarded to LiteLLM)
#   keep_alive   idle TTL AND the residency signal. `-1`/`forever`/`persistent` pin the model
#                (resident); a duration (e.g. 20m) lets it self-unload when idle (rotating).
#                Per-request keep_alive beats the global default — see docs/MODEL_LIFECYCLE.md.
#                This is the ONLY residency lever Ollama consumes; there is no separate priority
#                field (Ollama evicts LRU under OLLAMA_MAX_LOADED_MODELS pressure).
#   persona      persona_injector merges config/instructions/<capability>.md at request time.
#   purpose/strengths/weaknesses   why this model was chosen — read before swapping it.
#
# NOTE: capabilities are TOP-LEVEL keys (not nested under a `capabilities:` map) so the
# stdlib parser and the shell resolvers stay simple. Lists are flow-style [a, b, c].
# Run ./scripts/sync-models.sh after any change.

disk_gb: 40

# ── architecture — heavy reasoning / design tier ─────────────────────────────
architecture:
  role: Lead architect
  active: qwen3-coder:30b
  preferred: [qwen3-coder:30b, qwen4-coder:32b, deepseek-r2:32b]
  context: 32768
  temperature: 0.2
  keep_alive: -1
  persona: true
  purpose: [architecture, complex refactoring, multi-step debugging, design, repository-wide planning]
  strengths: [large-context reasoning, holds a whole subsystem in view, strong code generation]
  weaknesses: [slower, higher memory, non-thinking (no <think> stream)]

# ── implementation — everyday working coder ──────────────────────────────────
implementation:
  role: Daily coding
  active: qwen2.5-coder:14b-instruct-q4_K_M
  preferred: [qwen2.5-coder:14b-instruct-q4_K_M, qwen3-coder:14b]
  context: 16384
  temperature: 0.2
  num_predict: -1
  keep_alive: 20m
  persona: true
  purpose: [implementation, features, refactoring, tests, shell, python, typescript]
  strengths: [fast, low memory, excellent everyday code generation]
  weaknesses: [architecture, repository-wide planning]

# ── review — code review / bug & security detection ──────────────────────────
review:
  role: Code review
  active: deepseek-coder-v2:16b-lite-instruct-q4_K_M
  preferred: [deepseek-coder-v2:16b-lite-instruct-q4_K_M, qwen2.5-coder:32b]
  context: 16384
  temperature: 0.1
  num_predict: 2048
  keep_alive: 20m
  persona: true
  purpose: [code review, bug detection, security review, alternative solutions]
  strengths: [careful analysis, security awareness, concrete findings]
  weaknesses: [slower than the implementation tier, not for bulk generation]

# ── completion — inline autocomplete (FIM) ───────────────────────────────────
completion:
  role: Autocomplete
  active: qwen2.5-coder:3b-instruct-q4_K_M
  preferred: [qwen2.5-coder:3b-instruct-q4_K_M, qwen2.5-coder:1.5b]
  context: 4096
  temperature: 0
  num_predict: 128
  keep_alive: -1
  purpose: [inline completion, FIM, quick syntax fixes, small transforms]
  strengths: [very fast, tiny footprint, native FIM tokens]
  weaknesses: [no deep reasoning, short context]

# ── embeddings — semantic retrieval (INFRASTRUCTURE) ─────────────────────────
embeddings:
  role: Semantic retrieval
  active: nomic-embed-text
  preferred: [nomic-embed-text, mxbai-embed-large]
  context: 8192
  keep_alive: -1
  purpose: [semantic search, memory, retrieval for grepai]
  strengths: [always-on, tiny, grepai calls it directly on :11434]
  weaknesses: [not a chat model]

# ── vscode-chat — large-context IDE chat (VS Code Copilot via litellm-connector) ──
# IDE chat is a DIFFERENT workload from a coding agent: the client sends a big system
# prompt + tool schemas + workspace context, so it needs a large advertised window
# (the connector rejects prompts over ~0.95*max_input). Dedicated so architecture/
# implementation are not inflated to absorb it. Rotating (keep_alive 20m), NOT resident —
# the large 64K KV only loads while VS Code chat is active. Needs the daemon on q8 KV +
# flash attention (own the daemon) or the 64K KV ~doubles.
vscode-chat:
  role: IDE chat
  active: qwen3-coder:30b
  preferred: [qwen3-coder:30b]
  context: 65536
  temperature: 0.1
  num_predict: 4096
  keep_alive: 20m
  purpose: [VS Code Copilot Chat, interactive IDE Q&A, large-context editor conversations]
  strengths: [large window for IDE tool schemas + workspace context, 256K-capable backend]
  weaknesses: [heavy 64K KV — rotating not resident; a 2nd 30b instance vs architecture]

