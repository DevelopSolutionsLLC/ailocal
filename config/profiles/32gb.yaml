# profile: 32gb
# status: unverified — same capability schema and backends as 64gb, with contexts and TTLs scaled
# for 32 GB. NOT runtime-tested on 32 GB hardware; the memory fit below is estimated from model
# footprints, not measured. Validate with `ailocal validate` and a real session before relying on it.
# Full per-capability rationale lives in config/profiles/64gb.yaml.
#
# Fit on ~26 GB usable (32 GB minus OS/apps): only ONE large model resident at a time. architecture
# (~18 GB), implementation (~9 GB), and review (~10 GB) each fit alone; completion (~2 GB) and
# embeddings (~0.3 GB) stay warm. Keep OLLAMA_MAX_LOADED_MODELS low (2) on this tier.

disk_gb: 40

architecture:
  role: Lead architect
  active: qwen3-coder:30b
  preferred: [qwen3-coder:30b]
  context: 16384
  temperature: 0.2
  keep_alive: 30m
  priority: highest
  persona: true
  purpose: [architecture, complex refactoring, multi-step debugging, design]

implementation:
  role: Daily coding
  active: qwen2.5-coder:14b-instruct-q4_K_M
  preferred: [qwen2.5-coder:14b-instruct-q4_K_M]
  context: 16384
  temperature: 0.2
  num_predict: -1
  keep_alive: 30m
  priority: medium
  persona: true
  purpose: [implementation, features, tests, refactoring]

review:
  role: Code review
  active: deepseek-coder-v2:16b-lite-instruct-q4_K_M
  preferred: [deepseek-coder-v2:16b-lite-instruct-q4_K_M]
  context: 16384
  temperature: 0.1
  num_predict: 2048
  keep_alive: 15m
  priority: low
  persona: true
  purpose: [code review, bug detection, security review]

completion:
  role: Autocomplete
  active: qwen2.5-coder:3b-instruct-q4_K_M
  preferred: [qwen2.5-coder:3b-instruct-q4_K_M]
  context: 4096
  temperature: 0
  num_predict: 128
  keep_alive: forever
  priority: warm
  purpose: [inline completion, FIM, quick fixes]

embeddings:
  role: Semantic retrieval
  active: nomic-embed-text
  preferred: [nomic-embed-text]
  context: 8192
  keep_alive: forever
  priority: infrastructure
  purpose: [semantic search, memory, retrieval for grepai]
