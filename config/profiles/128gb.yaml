# profile: 128gb
# status: unverified — same capability schema and backends as 64gb, with larger contexts and TTLs
# for 128 GB. NOT runtime-tested on 128 GB hardware; the headroom below is estimated, not measured.
# Run `ailocal validate` and a real session before relying on it. Full rationale: 64gb.yaml.
#
# 128 GB comfortably holds all four generation models resident plus large KV caches, so every
# capability can stay warm with generous contexts. Consider a larger backend for architecture later
# (e.g. a 70B) once evaluated — kept at qwen3-coder:30b here since that is what is installed.

disk_gb: 40

architecture:
  role: Lead architect
  active: qwen3-coder:30b
  preferred: [qwen3-coder:30b, qwen2.5-coder:32b]
  context: 65536
  temperature: 0.2
  keep_alive: 4h
  persona: true
  purpose: [architecture, complex refactoring, multi-step debugging, design]

implementation:
  role: Daily coding
  active: qwen2.5-coder:14b-instruct-q4_K_M
  preferred: [qwen2.5-coder:14b-instruct-q4_K_M, qwen2.5-coder:32b]
  context: 32768
  temperature: 0.2
  num_predict: -1
  keep_alive: 2h
  persona: true
  purpose: [implementation, features, tests, refactoring]

review:
  role: Code review
  active: deepseek-coder-v2:16b-lite-instruct-q4_K_M
  preferred: [deepseek-coder-v2:16b-lite-instruct-q4_K_M]
  context: 32768
  temperature: 0.1
  num_predict: 4096
  keep_alive: 1h
  persona: true
  purpose: [code review, bug detection, security review]

completion:
  role: Autocomplete
  active: qwen2.5-coder:3b-instruct-q4_K_M
  preferred: [qwen2.5-coder:3b-instruct-q4_K_M]
  context: 8192
  temperature: 0
  num_predict: 128
  keep_alive: forever
  purpose: [inline completion, FIM, quick fixes]

embeddings:
  role: Semantic retrieval
  active: nomic-embed-text
  preferred: [nomic-embed-text]
  context: 8192
  keep_alive: forever
  purpose: [semantic search, memory, retrieval for grepai]
