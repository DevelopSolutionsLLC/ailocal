# profile: 16gb
# status: unverified — same capability schema as 64gb, but 16 GB is genuinely tight and the memory
# fit below is estimated, not measured. `enabled: false` marks capabilities whose backend does not
# realistically fit on 16 GB (advisory only — the capability is still routable, but expect an Ollama
# OOM if you actually load it). Run `ailocal validate` before relying on this tier.
#
# Fit on ~10 GB usable (16 GB minus OS/apps): only completion (~2 GB) + embeddings (~0.3 GB) stay
# comfortable. implementation (~9 GB) is marginal (one at a time, small context). architecture
# (~18 GB) and review (~10 GB) do NOT fit — enabled:false. Keep OLLAMA_MAX_LOADED_MODELS=2.
# Prefer a smaller backend here later (e.g. qwen2.5-coder:1.5b/7b) once evaluated.

disk_gb: 20

architecture:
  role: Lead architect
  active: qwen3-coder:30b
  preferred: [qwen3-coder:30b, qwen2.5-coder:7b-instruct-q4_K_M]
  context: 8192
  temperature: 0.2
  keep_alive: 15m
  persona: true
  enabled: false
  purpose: [architecture, design — does not fit 16 GB; pull a smaller backend to enable]

implementation:
  role: Daily coding
  active: qwen2.5-coder:14b-instruct-q4_K_M
  preferred: [qwen2.5-coder:14b-instruct-q4_K_M, qwen2.5-coder:7b-instruct-q4_K_M]
  context: 8192
  temperature: 0.2
  num_predict: -1
  keep_alive: 15m
  persona: true
  purpose: [implementation, features, tests — marginal on 16 GB, one model at a time]

review:
  role: Code review
  active: deepseek-coder-v2:16b-lite-instruct-q4_K_M
  preferred: [deepseek-coder-v2:16b-lite-instruct-q4_K_M]
  context: 8192
  temperature: 0.1
  num_predict: 2048
  keep_alive: 10m
  persona: true
  enabled: false
  purpose: [code review — does not fit 16 GB alongside anything; enable with a smaller backend]

completion:
  role: Autocomplete
  active: qwen2.5-coder:3b-instruct-q4_K_M
  preferred: [qwen2.5-coder:3b-instruct-q4_K_M, qwen2.5-coder:1.5b]
  context: 4096
  temperature: 0
  num_predict: 128
  keep_alive: forever
  purpose: [inline completion, FIM, quick fixes]

embeddings:
  role: Semantic retrieval
  active: nomic-embed-text
  preferred: [nomic-embed-text]
  context: 8192
  keep_alive: forever
  purpose: [semantic search, memory, retrieval for grepai]
