# ── ailocal :: SearXNG (local web search backend) ───────────────────────────
#
# The OTHER HALF of the ailocal stack. Never used alone — always merged with
# deploy/litellm/compose.yaml into the single "ailocal" Compose project
# (see src/ailocal/runtime.py). The project name is declared there; this file
# deliberately omits `name:` so the merge cannot conflict.
#
# Relative paths resolve from the REPO ROOT, because scripts pass
# --project-directory <repo root>. Hence ./deploy/searxng/settings.yml, not
# ./settings.yml.
#
# Service discovery: LiteLLM reaches this at http://searxng:8080 over the
# shared ailocal_net bridge. That hostname is the Compose *service* name
# (`searxng` below) — it resolves regardless of container_name. It must stay
# in sync with search_tools[].litellm_params.api_base in
# the generated config.yaml. LiteLLM appends /search and requests format=json,
# so settings.yml MUST keep `json` in search.formats.

services:

  searxng:
    # PINNED BY DIGEST (2026-07-30). `latest` is a FLOATING tag -- it moved
    # under us mid-audit, which is precisely why no production service may
    # depend on it. Scout: no vulnerable package detected at this digest.
    # To upgrade: pull, scan, run `ailocal test`, then update this line.
    image: searxng/searxng@sha256:79c2be18a18367484474bae9b18a8cd9085114ab3dcd49cac091cad8c548a0a9
    container_name: ${AILOCAL_SEARXNG_CONTAINER:-ailocal-searxng}
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - ailocal_net
    ports:
      # Localhost-only, matching LiteLLM. Publishing to the host is NOT required
      # for LiteLLM (that traffic stays on ailocal_net); it exists so `ailocal doctor`
      # and a human can probe the UI/JSON API directly. Was 0.0.0.0 — that
      # exposed the instance to the whole LAN for no benefit.
      - "127.0.0.1:${AILOCAL_SEARXNG_PORT:-8080}:8080"
    environment:
      # This 0.0.0.0 IS required and is not a security hole: it is the bind
      # address INSIDE the container. Binding container-loopback instead would
      # make SearXNG unreachable from LiteLLM. Host exposure is controlled by
      # the 127.0.0.1 port mapping above, not by this value.
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_BASE_URL: http://localhost:8080/
      # Generated into .env by install.sh. SearXNG refuses to start without a
      # real secret; never ship the placeholder from settings.yml.
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      # RENDERED settings, not the tracked source. deploy/searxng/settings.yml
      # holds a __BRAVE_API_KEY__ placeholder; runtime.py renders it
      # into $AILOCAL_STATE (outside the checkout, mode 0600) with the value of
      # BRAVE_API from .env. SearXNG has no env interpolation for engine
      # api_key, so substitution before mount is the only secret-safe path.
      # Mounted read-only: the container must never write the rendered secret.
      - ${AILOCAL_SEARXNG_SETTINGS:?run via `ailocal` so settings are rendered}:/etc/searxng/settings.yml:ro
      # Silences the two botdetection startup lines. Does NOT enable the
      # limiter (server.limiter: false does that) — see the file's header.
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  searxng_cache:
