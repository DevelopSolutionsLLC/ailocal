general:
  instance_name: "local-ai-search"
  debug: false

server:
  # 0.0.0.0 INSIDE the container only; compose publishes it as 127.0.0.1:8080,
  # so it is not reachable off this machine.
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "change_this_to_a_random_string_for_production"

  # Set explicitly to match upstream's default, because the two log lines it
  # produces look alarming during a log audit and have now been investigated
  # twice. AUDITED 2026-07-27:
  #
  #   WARNING searx.botdetection.config: missing config file .../limiter.toml
  #   ERROR   searx.botdetection: X-Forwarded-For nor X-Real-IP header is set!
  #
  # Both are emitted ONCE at startup and never again — measured: four searches
  # (direct and over the LiteLLM docker network) produced zero further
  # botdetection lines, and all returned results. The limiter is the abuse
  # control for PUBLIC instances; this one is private, bound to loopback, with
  # a single trusted consumer. With `limiter: false` nothing is rate-limited or
  # blocked, so neither message affects functionality.
  #
  # Do NOT "fix" them by adding a limiter.toml or by injecting
  # X-Forwarded-For/X-Real-IP from LiteLLM: that turns ON machinery this
  # deployment does not need, to silence a message that costs nothing.
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

outgoing:
  # SearXNG's own default is 3.0s, applied to every engine that doesn't override
  # it. github regularly exceeded that (measured: 3.2 s -> TimeoutException), so
  # the engine below raises its own. Left at the default here on purpose: a
  # global raise would let a genuinely dead engine hold up every search.
  request_timeout: 3.0

# ── Engine policy ────────────────────────────────────────────────────────────
# keep_only is applied to SearXNG's default engine list BEFORE our `engines:`
# block is merged onto it, so this whitelist decides what exists at all.
#
# It replaces the previous `disabled: true` approach, which was insufficient:
# `use_default_settings: true` LOADS every default engine, and some fail at
# *init* time regardless of `disabled` — wikidata 403s against
# query.wikidata.org on every boot, ahmia and torch fail to import. Those three
# errors were startup noise from engines we never query. keep_only drops them
# before load, so they cannot fail.
#
# Names must match the default list exactly; an unmatched name is silently
# dropped, not an error.
#
# ENGINE AVAILABILITY DRIFTS — re-measure, do not trust this list on faith.
# Two exclusions here were reversed by measurement on 2026-07-28.
#
# Measured (query: "python asyncio semaphore", results returned):
#   google cse 20 · github 14 · stackoverflow 10 · wikipedia 0 (nothing on
#   technical queries) · wikidata 0 · qwant 0 (CAPTCHA).
#
# 2026-07-28 re-audit:
#   mojeek     REMOVED. Was the designated google-cse fallback; measured dead
#              from this network — HTTP 403 on 3/3 direct requests and
#              "Suspended: access denied" with 0 results on a !mjk bang. It
#              403'd on the first query of every fresh container, so it produced
#              only error noise.
#   duckduckgo ADDED in its place. Previously excluded for CAPTCHA; re-probed
#              and answering.
#   qwant      stays excluded. Its CAPTCHA errors in older logs predate this
#              keep_only list — it is no longer loaded and cannot fail. Check
#              timestamps before acting on log lines; much of it is history.
#
# Deliberately NOT solved with Redis, a proxy pool, or a FlareSolverr-style
# browser: SearXNG is an aggregator, so engine selection is the correct lever
# and keeps the container at ~167 MiB.
use_default_settings:
  engines:
    keep_only:
      - google cse
      - duckduckgo
      - github
      - stackoverflow
      - wikipedia
      - askubuntu
      - superuser
      - mdn
      - pypi
      - npm
      - docker hub

engines:
  # ── Scraped general-web: OPT-IN ONLY (`disabled: true`), 2026-07-28 ───────
  # `disabled: true` does NOT remove an engine. It stops SearXNG querying it on
  # every search while leaving it reachable on demand via its bang (!gcse, !ddg).
  # That is the "fallback only" shape, and it is the correct answer here.
  #
  # MEASURED over 10 agent-style queries, twice:
  #                    run 1        run 2 (after sustained use)
  #   google cse        10%           0%   "Suspended: too many requests"
  #   duckduckgo        30%           0%   "CAPTCHA (wt-wt)"
  #   github/stackoverflow/mdn/docker hub/pypi/npm/askubuntu/superuser: 90-100%
  #
  # With BOTH of these at 0%, the instance still returned 52.1 results/query and
  # ZERO empty queries — the API-backed engines carry the whole workload. So the
  # scraped pair contributed no reliable coverage while generating every error
  # line in the log and every retry of latency.
  #
  # WHY THIS IS NOT FIXABLE BY CONFIG: SearXNG scrapes, so upstream classifies it
  # as a bot and rate-limits it — upstream's own docs say exactly this. Headers,
  # limiter settings and trusted_proxies change nothing about it; they govern
  # OUR bot detection of INBOUND requests, not upstream's of our OUTBOUND ones.
  # The documented mitigations are a keyed API, rotation, or more source IPs.
  # Engine selection is the lever we actually have.
  #
  # Querying them less is also the only thing that helps them recover: the
  # suspensions are volume-triggered, so an agent burst is what causes them.
  - name: google cse
    disabled: true

  # Second general-web source, so a google cse 429 does not mean zero results.
  #
  # This slot held mojeek until 2026-07-28, when it was measured DEAD from this
  # network: HTTP 403 on 3/3 direct requests, and SearXNG reporting
  # "Suspended: access denied" with 0 results on a !mjk bang query. A keyless
  # engine that 403s on first contact is not a fallback, it is error noise —
  # it 403'd on the very first query of every fresh container.
  #
  # duckduckgo was re-probed at the same time and now answers where it
  # previously CAPTCHA'd — but only INTERMITTENTLY: measured 2 of 3 queries
  # served, the third returning `unresponsive_engines: [[duckduckgo, CAPTCHA]]`.
  # That is still strictly better than the 0 of 3 it replaced, and SearXNG
  # degrades cleanly (44 results from the remaining engines on the failing
  # query). Do not read an occasional ddg CAPTCHA line as a regression; read
  # zero results as one.
  - name: duckduckgo
    shortcut: ddg
    disabled: true

  # API-backed, no CAPTCHA, directly useful for coding queries.
  - name: github
    shortcut: gh
    categories: [general, it]
    timeout: 6.0
    disabled: false

  - name: stackoverflow
    shortcut: so
    categories: [general, it]
    disabled: false

  # Returns nothing on technical queries; kept for non-code lookups only.
  - name: wikipedia
    shortcut: wp
    categories: [general]
    disabled: false

  # ── API-backed engines, added 2026-07-28 after measurement ────────────────
  # Measured over 10 queries BEFORE this block:
  #   github 100%  stackoverflow 100%  duckduckgo 30% (CAPTCHA)  google cse 10%
  #   ("Suspended: too many requests")
  # The split is not incidental. SearXNG scrapes, so upstream classifies it as a
  # bot and rate-limits it -- upstream's own docs say so. Engines with a real API
  # never hit that path, which is exactly why the two 100% engines are the two
  # API-backed ones. No amount of header or limiter tuning changes a scraped
  # engine's CAPTCHA rate; only engine SELECTION does.
  #
  # These are all API-backed and all relevant to this stack's actual queries
  # (python/go/ts/shell/docker/packaging), so they add reliable coverage where
  # google cse and duckduckgo are unreliable.
  - name: askubuntu
    shortcut: ubuntu
    categories: [general, it]
    disabled: false
  - name: superuser
    shortcut: su
    categories: [general, it]
    disabled: false
  - name: mdn
    shortcut: mdn
    categories: [general, it]
    disabled: false
  - name: pypi
    shortcut: pypi
    categories: [general, it]
    disabled: false
  - name: npm
    shortcut: npm
    categories: [general, it]
    disabled: false
  - name: docker hub
    shortcut: dh
    categories: [general, it]
    disabled: false

ui:
  show_about: false
  show_search_log: false

logging:
  level: warning
