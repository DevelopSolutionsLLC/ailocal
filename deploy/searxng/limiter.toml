# limiter.toml — bot-detection policy for a single-user local proxy.
#
# SearXNG assumes public exposure. This instance is reachable only from
# LiteLLM on the internal compose network, so the public-facing heuristics
# produce noise rather than protection.

[botdetection]
# Trusted proxies: LiteLLM is the only client, and it reaches SearXNG over the
# internal network. Nothing outside the compose network can set these headers,
# so accepting them here does not widen the trust boundary.
trusted_proxies = [
  "127.0.0.0/8",
  "::1/128",
  "172.16.0.0/12",
]

[botdetection.ip_limit]
# The abuse controls, all off: one local process issues every query.
filter_link_local = false
link_token = false

[botdetection.ip_lists]
# Loopback plus the RFC1918 range docker's bridge allocates from (this stack
# lands on 172.18.0.0/16). Anything else cannot reach the published port, which
# is bound to 127.0.0.1 by compose.
pass_ip = [
  "127.0.0.0/8",
  "::1/128",
  "172.16.0.0/12",
]
block_ip = []
