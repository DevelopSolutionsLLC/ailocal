name: ailocal

# ── ailocal :: LiteLLM proxy ────────────────────────────────────────────────
#
# This file is ONE HALF of the ailocal stack. It is never used alone — scripts
# always merge it with deploy/searxng/docker-compose.yml into a single Compose
# project named "ailocal" (see scripts/lib/compose.sh):
#
#   docker compose --project-directory <repo root> \
#     -f deploy/litellm/docker-compose.yml \
#     -f deploy/searxng/docker-compose.yml  ...
#
# Because --project-directory is the repo root, every relative path below is
# resolved from the repo root (NOT from this file's directory), and Compose
# auto-loads the root .env. Do not "fix" these paths to be relative to deploy/.
#
# Ollama runs NATIVELY on the host for Apple Metal (GPU) acceleration and is
# reached via host.docker.internal:11434 ($OLLAMA_URL). Never containerize
# Ollama on Apple Silicon — it loses GPU access.

networks:
  ailocal_net:
    driver: bridge

services:

  litellm:
    # Docs: https://docs.litellm.ai/docs/proxy/docker_quick_start
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ailocal-litellm
    restart: unless-stopped
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      --config /app/config/config.yaml
      --port 4000
      --num_workers 1
    networks:
      - ailocal_net
    # SearXNG only needs to be *started*, not healthy: LiteLLM registers the
    # search tool from config at boot and resolves the hostname per request.
    depends_on:
      - searxng
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      # Optional cloud fallback — disabled unless you add a key AND uncomment a
      # cloud-backed model block in config/litellm/config.yaml.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # persona_injector.py reads the baked instruction files from here.
      - AILOCAL_INSTRUCTIONS_DIR=/app/instructions
      # tool_gateway.py — tool-payload measurement / filtering.
      #   off    (default) hook returns immediately, nothing measured or changed
      #   report measure and log; NEVER mutates the request
      #   filter apply the allowlist in AILOCAL_TOOL_POLICY
      # Stays "off" in the committed default: FILTER changes what the model can
      # do, so it is opt-in per machine via .env, never on by shipping.
      - AILOCAL_TOOL_GATEWAY=${AILOCAL_TOOL_GATEWAY:-off}
      - AILOCAL_TOOL_POLICY=/app/config/tool-policy.yaml
      # Set to /app/captures to dump real client tool payloads for analysis.
      # Empty = no capture. Payloads contain tool schemas, not conversation.
      - AILOCAL_TOOL_GATEWAY_CAPTURE=${AILOCAL_TOOL_GATEWAY_CAPTURE:-}
    volumes:
      # config.yaml is GENERATED by scripts/sync-models.py — config/litellm is
      # its output directory and remains the single source of truth. Only the
      # deployment *definition* lives under deploy/.
      - ./config/litellm:/app/config:ro
      # Instruction source of truth — read by the persona_injector hook.
      - ./config/instructions:/app/instructions:ro
      # Writable: the only path the proxy may write to. /app/config is ro, so
      # tool_gateway captures need their own mount.
      - ./data/tool-captures:/app/captures
    ports:
      # Localhost-only per security spec. To expose on a LAN, put an
      # authenticating reverse proxy in front — never expose LiteLLM directly.
      - "127.0.0.1:4000:4000"
    healthcheck:
      # /health/liveliness = proxy process is up. It does NOT require Ollama to
      # be reachable (that is checked by doctor.sh). curl is not in the LiteLLM
      # image, so use Python (always present).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ── Architecture Notes ──────────────────────────────────────────────────────
#
# The stack is intentionally minimal: LiteLLM + SearXNG in front of a
# host-native Ollama. LiteLLM runs with NO database and NO cache.
#
# Removed services (unnecessary for local single-user agent use):
#   caddy       — reverse proxy; clients hit :4000 directly, so it did nothing
#   postgres    — only needed for spend logs / virtual keys / admin UI
#   redis       — response cache; near-zero hit rate for coding agents
#   open-webui  — browser chat UI; out of scope
#   qdrant, mcp-server, prometheus, grafana — never used by this stack
#
# Security hardening (OWASP A05:2021): no-new-privileges + cap_drop ALL.
